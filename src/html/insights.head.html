<style>
/* ---------- Insights: the daily briefing, built on the guide reading layout ---------- */
.ins-draft{position:relative;z-index:2;margin:6px auto 0;max-width:760px;padding:12px 18px;border-radius:16px;background:#FFF6E8;border:1px solid #F3DFB8;font-size:15px;line-height:1.45;color:#6A4A12;text-align:center}
.ins-draft b{color:#4E3408}

/* the front page card under the headline: every story at a glance */
.ins-front{position:relative;width:100%;max-width:860px;margin:clamp(20px,3.4svh,36px) 0 0;padding:clamp(16px,2.2svh,22px) clamp(16px,2vw,24px);border-radius:28px;background:rgba(255,255,255,.92);border:1px solid var(--line);box-shadow:0 2px 6px rgba(20,12,8,.03),0 34px 70px -46px rgba(120,30,10,.5);text-align:left;backdrop-filter:blur(6px)}
.fr-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:0 4px 12px;border-bottom:1px solid var(--line)}
.fr-k0{display:inline-flex;align-items:center;gap:9px;font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.fr-k0 i{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px var(--chip)}
.fr-c{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;color:var(--ink2)}
.fr-dot{width:8px;height:8px;border-radius:50%;margin-left:6px}
.fr-dot.b{background:var(--red)}.fr-dot.r{background:#2C5E9E}
.fr-l{display:grid;grid-template-columns:1fr 1fr;column-gap:22px;margin:0;padding:6px 0 0;list-style:none}
.fr-l li{min-width:0}
.fr-l a,.fr-l li > .fr-n{color:inherit;text-decoration:none}
.fr-l a,.ins-ghost .fr-l li{display:flex;align-items:flex-start;gap:12px;padding:10px 6px;border-radius:14px;transition:background .2s ease}
.fr-l a:hover{background:var(--soft)}
.fr-l a:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.fr-n{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--soft);border:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--ink2)}
.fr-b{display:flex;flex-direction:column;gap:3px;min-width:0}
.fr-b b{font-size:15.5px;line-height:1.3;font-weight:600;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fr-k{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.fr-k.breaking{color:var(--red)}.fr-k.radar{color:#2C5E9E}.fr-k.mean{color:var(--go)}

/* the stories */
.sd{display:none}
.ins-st{scroll-margin-top:24px}
.ins-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px}
.ins-meta .tag{gap:6px}
.tag.ins-radar{background:#EAF1FA;color:#24507F;border-color:transparent}
.ins-reg{font-size:13.5px;font-weight:600;color:var(--mut)}
.ins-src{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px;font-size:14px}
.ins-src > span{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-right:2px}
.ins-src a{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;background:#FFFFFF;border:1px solid var(--line);font-weight:600;color:var(--ink);text-decoration:none;transition:border-color .2s ease,background .2s ease}
.ins-src a:hover{border-color:var(--line2);background:var(--soft)}
.ins-src a svg{color:var(--mut)}
.ins-how i{color:var(--go)}

/* review mode */
.ins-keep{display:inline-flex;align-items:center;gap:10px;margin:0 0 12px;padding:8px 14px 8px 10px;border-radius:999px;background:var(--okbg);color:var(--ok);font-size:14px;font-weight:600;cursor:pointer}
.ins-keep input{width:18px;height:18px;accent-color:var(--go)}
.ins-st:has(.ins-keep input:not(:checked)) > :not(.ins-keep){opacity:.38}
.ins-st:has(.ins-keep input:not(:checked)) .ins-keep{background:var(--soft);color:var(--mut)}
.ins-bar{position:sticky;bottom:16px;z-index:5;display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:28px 0 0;padding:14px;border-radius:24px;background:rgba(255,255,255,.95);border:1px solid var(--line);box-shadow:0 20px 50px -30px rgba(20,12,8,.35)}
.ins-skip{height:48px;padding:0 20px;border-radius:999px;background:transparent;border:1px solid var(--line2);font:600 15px var(--ui);color:var(--ink2);cursor:pointer}
.ins-skip:hover{background:var(--soft)}

/* earlier briefings */
.ins-arch{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:22px 0 0;padding:0;list-style:none}
.ins-arch a{display:flex;flex-direction:column;gap:8px;height:100%;padding:20px;border-radius:22px;background:#FFFFFF;border:1px solid var(--line);color:inherit;text-decoration:none;transition:border-color .2s ease,transform .25s ease,box-shadow .25s ease}
.ins-arch a:hover{border-color:var(--line2);box-shadow:0 24px 50px -38px rgba(120,30,10,.5)}
.ar-d{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.ins-arch b{font-size:17px;line-height:1.3;font-weight:600}
.ar-n{display:inline-flex;align-items:center;gap:6px;margin-top:auto;font-size:14px;font-weight:600;color:var(--red)}

/* before the first edition */
.ins-wait-in{display:flex;flex-direction:column;align-items:center;text-align:center}
.ins-ghost{max-width:760px}
.ins-ghost .fr-l{grid-template-columns:1fr}
.ins-row{margin-top:clamp(18px,3svh,30px)}

@media (max-width:900px){.ins-arch{grid-template-columns:1fr 1fr}}
@media (max-width:720px){
  .fr-l{grid-template-columns:1fr}
  .ld{display:none}.sd{display:inline}
  .fr-l li:nth-child(n+5){display:none}
  .ins-front{border-radius:22px}
  .ins-arch{grid-template-columns:1fr}
  .ins-bar{bottom:10px}
  .ins-bar .btn-create{flex:1 1 auto}
}
@media (max-height:760px) and (max-width:720px){.fr-l li:nth-child(n+4){display:none}.ins-ghost .fr-l li:nth-child(3){display:none}.ins-wait .lede{font-size:16px}}
</style>

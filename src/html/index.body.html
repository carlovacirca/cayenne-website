    var aiP = (S.ai && sampleFn) ? runAI() : liveAI();
    later(function () { stepAt(1); }, 1100);
    later(function () { stepAt(2); }, 2300);
    var minWait = new Promise(function (r) { later(r, 3500); });
    Promise.all([minWait, aiP]).then(function (v) {
      if (id !== S.loadId) return;
      S.aiResult = v[1];
      stepAt(3);
      later(function () { stepAt(4); later(function () { S.created = true; S.phase = 'module'; renderShell(); window.scrollTo(0, 0); }, 600); }, 900);
    });
  }
  function clean(s) { return String(s || '').replace(/\s*—\s*/g, ', ').replace(/\s*–\s*/g, ' to ').trim(); }
  /* Module 1 written by Claude on the server; the designed example stays if it is not switched on or takes too long */
  var LIVE = { places: null, ai: null, signin: false };
  fetch('/api/me').then(function (r) { return r.ok ? r.json() : null; }).then(function (d) { if (d && !d.notReady) LIVE.signin = true; }).catch(function () {});
  function liveAI() {
    if (LIVE.ai === false) return Promise.resolve(null);
    var b = S.biz, ctl = window.AbortController ? new AbortController() : null;
    var stop = setTimeout(function () { if (ctl) ctl.abort(); }, 20000);
    return fetch('/api/module1', { method: 'POST', headers: { 'content-type': 'application/json' }, signal: ctl ? ctl.signal : undefined,
      body: JSON.stringify({ name: b.name, cat: b.custom ? '' : b.cat, town: b.town || '', level: S.level, goals: S.goals.map(function (id) { return goal(id).label; }) }) })
      .then(function (r) { clearTimeout(stop); if (r.status === 501) { LIVE.ai = false; return null; } return r.ok ? r.json() : null; })
      .then(function (r) { if (r && Array.isArray(r.whatIs) && Array.isArray(r.steps)) { LIVE.ai = true; return r; } return null; })
      .catch(function () { clearTimeout(stop); return null; });
  }
  function runAI() {
    var b = S.biz, gl = S.goals.map(function (id) { return goal(id).label; });
    var prompt = 'You are writing Module 1 of a free AI course for the owner of a small UK business.\n' +
      'Business: ' + b.name + (b.custom ? '' : ', ' + aCat(b) + ' in ' + b.town) + '.\n' +
      'What they want AI to help with: ' + gl.join('; ') + '.\n' +
      'Their AI knowledge: level ' + S.level + ' of 5 (' + LEVELS[S.level].label + ').\n' +
      'Write in plain British English, warm and practical, with no jargon and no em dashes. Speak to the owner as "you".\n' +
      'Reply with JSON only, in this shape:\n' +
      '{"lead": "one or two sentences welcoming them, mentioning their business and their level",\n' +
      ' "whatIs": ["two short paragraphs, under 60 words each, explaining what AI chat tools are, with an example from their kind of business"],\n' +
      ' "steps": ["three short, concrete steps, under 25 words each, to use AI for: ' + gl[0] + '"],\n' +
      ' "prompt": "one ready-to-paste prompt for ChatGPT, Claude or Gemini that does that first job for their business, with [square brackets] where they add their own details"}';
    return sampleFn.json(prompt, { modelTier: 'default' }).then(function (r) {
      if (r && Array.isArray(r.whatIs) && Array.isArray(r.steps) && typeof r.prompt === 'string') {
        return { lead: clean(r.lead), whatIs: r.whatIs.slice(0, 3).map(clean), steps: r.steps.slice(0, 4).map(clean), prompt: clean(r.prompt) };
      }
      S.aiNote = 'Live AI sent an unexpected answer, so this is the designed example.'; return null;
    }, function (e) {
      S.aiNote = e && e.code === 'not_granted' ? 'Live AI was not allowed, so this is the designed example.' : 'Live AI was not available, so this is the designed example.';
      return null;
    });
  }

  /* ---------- step 2 navigation ---------- */
  function s2next() {
    var secs = sections(), n = secs.length;
    if (S.sec === n - 1 && !S.goals.length) {
      S.s2err = 'Pick at least one, so we know what to teach you.';
      S.focus = 's2-next'; renderCreator(); return;
    }
    S.secDone = Math.max(S.secDone, S.sec + 1); S.s2err = ''; S.ownOpen = false; S.secDir = 'next';
    if (S.sec < n - 1) { S.sec++; S.anim = 'list'; S.focus = 's2-title'; }
    else { S.s2done = true; S.at = 3; S.anim = 'step'; S.focus = 'cz-q'; }
    renderCreator();
  }

  /* ---------- events ---------- */
  function onClick(e) {
    var t = e.target.closest('[data-act]');
    var a = e.target.closest('a[href^="#"]');
    if (a) e.preventDefault();
    if (!t) return;
    var act = t.dataset.act;
    if (t.getAttribute('aria-disabled') === 'true') {
      var need = S.at === 1 ? $('#biz') : $('#lv-0');
      if (need) { need.focus({ preventScroll: true }); nudge(need.closest('.field') || need.closest('.lvl')); }
      return;
    }
    switch (act) {
      case 'biz-pick': pick(S.res[+t.dataset.i]); break;
      case 'biz-custom': pickCustom(); break;
      case 'biz-clear': var inp = $('#biz'); inp.value = ''; updateBiz(inp); inp.focus(); break;
      case 'biz-change': S.biz = null; S.q = ''; S.s2done = false; S.sec = 0; S.secDone = 0; S.at = 1; S.anim = 'step'; S.secDir = 'back'; S.focus = 'biz'; renderCreator(); updateSlot(); break;
      case 'goal': var id = t.dataset.id, i = S.goals.indexOf(id);
        if (i > -1) S.goals.splice(i, 1); else { S.goals.push(id); t.classList.remove('bump'); void t.offsetWidth; t.classList.add('bump'); }
        if (S.s2err) { S.s2err = ''; S.popId = i > -1 ? null : id; S.focus = null; renderCreator(); var tb = $('.ch[data-id="' + id + '"]'); if (tb) tb.focus({ preventScroll: true }); } else sync();
        break;
      case 'own-open': S.ownOpen = true; S.focus = 'own-goal'; renderCreator(); break;
      case 'to-lists': S.at = 2; S.sec = 0; S.secDir = 'next'; S.anim = 'step'; S.focus = 's2-title'; renderCreator(); break;
      case 'lv-back': S.at = 2; S.s2done = false; S.sec = sections().length - 1; S.secDir = 'back'; S.anim = 'step'; S.focus = 's2-title'; renderCreator(); break;
      case 'own-add': addOwn(); break;
      case 's2-next': s2next(); break;
      case 's2-back': S.s2err = ''; S.ownOpen = false; S.secDir = 'back';
        if (S.sec > 0) { S.sec--; S.anim = 'list'; S.focus = 's2-title'; } else { S.at = 1; S.anim = 'step'; S.focus = 'cz-q'; }
        renderCreator(); break;
      case 'level': S.level = +t.dataset.n; sync(); t.classList.remove('bump'); void t.offsetWidth; t.classList.add('bump'); animateProgress();
        var cb = $('#create'); if (cb && ready()) { cb.removeAttribute('aria-disabled'); cb.classList.remove('go'); void cb.offsetWidth; cb.classList.add('go'); } break;
      case 'create': startLoading(); break;
      case 'open-m1': S.phase = 'module'; renderShell(); window.scrollTo(0, 0); break;
      case 'restart': restart(); break;
      case 'home': S.phase = 'home'; renderShell(); window.scrollTo(0, 0); break;
      case 'top': goTop(); break;
      case 'start': if (S.created) { S.phase = 'module'; renderShell(); window.scrollTo(0, 0); break; }
        setSticky(false); goTop(); later(function () { var f = $('#biz') || $('#open-m1') || $('#cz-q'); if (f) f.focus({ preventScroll: true }); }, 500); break;
      case 'jump': var tg = $(t.getAttribute('href')); if (tg) { try { tg.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch (er) { tg.scrollIntoView(); } } break;
      case 'menu': var mn = $('#mnav'); if (mn) { mn.hidden = !mn.hidden; t.setAttribute('aria-expanded', String(!mn.hidden)); } break;
      case 'soon': toast('Coming soon'); break;
      case 'done1': keepScroll(function () { S.done1 = true; renderShell(); }); toast('Module 1 done. One more step to save it.'); break;
      case 'google':
        /* real Google sign-in when it is set up: the course goes with them so it is saved to their account */
        if (LIVE.signin) { try { sessionStorage.setItem('cy_course', JSON.stringify({ business: { name: S.biz.name, cat: S.biz.cat, town: S.biz.town }, goals: S.goals.map(function (id) { return goal(id).label; }), level: S.level, done: S.done1 ? ['m1'] : [] })); } catch (er) {} location.href = '/api/auth/google?next=/my-course'; break; }
        keepScroll(function () { S.signed = true; renderShell(); }); toast('Google sign-in is coming soon'); break;
      case 'to-gate': var gt = $('#signup'); if (gt) gt.scrollIntoView({ behavior: 'smooth', block: 'center' }); break;
      case 'copy': copyPrompt(); break;
    }
  }
  app.addEventListener('click', onClick);
  app.addEventListener('toggle', function (e) {
    if (!e.target.open || !e.target.closest || !e.target.closest('.faq')) return;
    $$('.faq details').forEach(function (d) { if (d !== e.target) d.open = false; });
  }, true);
  document.addEventListener('click', function (e) { var mn = $('#mnav'); if (mn && !mn.hidden && !e.target.closest('#mnav') && !e.target.closest('.menu')) { mn.hidden = true; var mb = $('.menu'); if (mb) mb.setAttribute('aria-expanded', 'false'); } });
  window.addEventListener('resize', function () {
    clearTimeout(onClick.rt);
    onClick.rt = setTimeout(function () { if (S.phase !== 'home') return; fitHeadline(); if (S.at !== 2) return; if (cardNarrow() !== S.narrow) renderCreator(); else balanceRows(); }, 150);
  });
  sticky.addEventListener('click', onClick);
  function keepScroll(fn) { var y = window.scrollY; fn(); window.scrollTo(0, y); }
  function addOwn() {
    var inp = $('#own-goal'); if (!inp) return;
    var v = inp.value.trim(); if (!v) { inp.focus(); return; }
    var id = 'own' + (++nOwn);
    S.custom[id] = { label: cap(v), desc: 'Added by you', short: cap(v).slice(0, 28), module: cap(v), auto: v.toLowerCase(),
      steps: ['Describe the problem to AI in two or three sentences, as you would explain it to a friend.', 'Ask for three simple ways to fix it, then pick the easiest one to try this week.', 'Come back with what happened and ask AI to improve the plan.'],
      prompt: 'I run {name}, {a_cat}{in_town}. I want help with this: ' + v + '. Suggest three simple ways AI could help, starting with the easiest. British English, plain words.' };
    S.goals.push(id); S.s2err = ''; S.ownOpen = false; S.popId = id;
    renderCreator();
    var nb = $('.ch[data-id="' + id + '"]'); if (nb) nb.focus({ preventScroll: true });
  }
  function copyPrompt() {
    var el = $('#prompt-t'); if (!el) return;
    var txt = el.textContent;
    function fallback() { var r = document.createRange(); r.selectNodeContents(el); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); toast('Selected. Press Ctrl+C to copy.'); }
    try { navigator.clipboard.writeText(txt).then(function () { toast('Prompt copied'); }, fallback); } catch (e) { fallback(); }
  }
  app.addEventListener('mousedown', function (e) { if (e.target.closest('.biz-opt, .use-typed')) e.preventDefault(); });
  app.addEventListener('input', function (e) { if (e.target.classList.contains('biz-input')) updateBiz(e.target); });
  app.addEventListener('keydown', function (e) {
    var t = e.target;
    if (t.classList && t.classList.contains('biz-input')) {
      var pop = $('.pop', t.closest('.combo'));
      if (e.key === 'ArrowDown' && S.res.length) { e.preventDefault(); S.hi = Math.min(S.res.length - 1, S.hi + 1); setActive(t); }
      else if (e.key === 'ArrowUp' && S.res.length) { e.preventDefault(); S.hi = Math.max(0, S.hi - 1); setActive(t); }
      else if (e.key === 'Enter') { e.preventDefault(); if (S.hi > -1 && S.res[S.hi]) pick(S.res[S.hi]); else if (S.q.trim()) pickCustom(); }
      else if (e.key === 'Escape') { pop.hidden = true; t.setAttribute('aria-expanded', 'false'); }
      return;
    }
    if (t.id === 'own-goal' && e.key === 'Enter') { e.preventDefault(); addOwn(); }
    if (t.id === 'own-goal' && e.key === 'Escape') { e.preventDefault(); S.ownOpen = false; renderCreator(); var ob = $('.ch-add'); if (ob) ob.focus({ preventScroll: true }); }
  });
  app.addEventListener('focusin', function (e) { if (e.target.classList && e.target.classList.contains('biz-input') && e.target.value.trim()) updateBiz(e.target); });
  document.addEventListener('pointerdown', function (e) {
    if (!e.target.closest('.combo')) $$('.combo .pop').forEach(function (p) { if (!p.hidden) { p.hidden = true; var i = $('#biz'); if (i) i.setAttribute('aria-expanded', 'false'); } });
  });

  /* ---------- prototype controls ---------- */
  function restart() {
    cancelTimers();
    S.phase = 'home'; S.created = false; S.q = ''; S.res = []; S.hi = -1; S.biz = null; S.goals = []; S.custom = {}; S.level = null;
    S.sec = 0; S.secDone = 0; S.s2done = false; S.s2err = ''; S.done1 = false; S.signed = false; S.aiResult = null; S.aiNote = ''; S.lastPct = 0; S.intro = true;
    S.at = 1; S.anim = null; S.ownOpen = false;
    renderShell(); window.scrollTo(0, 0);
  }
  function fillExample() {
    cancelTimers();
    S.phase = 'home'; S.created = false; S.biz = BIZ[0]; S.q = ''; S.goals = ['quotes', 'followup', 'admin', 'social', 'repeat']; S.level = 2;
    var n = sections().length; S.sec = n - 1; S.secDone = n; S.s2done = true; S.s2err = ''; S.at = 3; S.anim = null; S.ownOpen = false;
    S.done1 = false; S.signed = false; S.aiResult = null; S.aiNote = ''; S.morph = true;
    renderShell(); updateSlot(); window.scrollTo(0, 0);
  }
  if ($('.proto')) $('.proto').addEventListener('click', function (e) {
    var b = e.target.closest('[data-proto]'); if (!b) return;
    var p = b.dataset.proto;
    if (p === 'pages') { var pm = $('#pr-menu'); pm.hidden = !pm.hidden; b.setAttribute('aria-expanded', String(!pm.hidden)); e.stopPropagation(); return; }
    if (p === 'restart') restart();
    if (p === 'fill') fillExample();
    if (p === 'phone') {
      var on = !stage.classList.contains('phone');
      stage.classList.toggle('phone', on); document.body.classList.toggle('phone', on);
      b.setAttribute('aria-pressed', String(on));
      try { localStorage.setItem('cayenne-home-phone', on ? '1' : '0'); } catch (er) {}
      if (S.phase === 'home') renderCreator();
      window.scrollTo(0, 0);
    }
  });
  document.addEventListener('click', function (e) { var pm = $('#pr-menu'); if (pm && !pm.hidden && !e.target.closest('#pr-menu') && !e.target.closest('#pr-pages')) { pm.hidden = true; $('#pr-pages').setAttribute('aria-expanded', 'false'); } });
  if ($('#pr-ai-box')) $('#pr-ai-box').addEventListener('change', function (e) { S.ai = e.target.checked; toast(S.ai ? 'Module 1 will be written by live AI' : 'Module 1 will use the designed example'); });

  /* ---------- start ---------- */

  renderShell();
  try { var pre = new URLSearchParams(location.search).get('biz'); var bi = $('#biz'); if (pre && bi) { bi.value = pre.slice(0, 80); updateBiz(bi); } } catch (e) {}
  if (window.claude && typeof window.claude.use === 'function') {
    window.claude.use('sample').then(function (fn) { if (fn) { sampleFn = fn; if ($('#pr-ai')) $('#pr-ai').hidden = false; } }, function () {});
  }
})();
</script>

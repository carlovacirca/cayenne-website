<style>
/* the screen: nav, the centred headline and card, the footer's base line */
.si .heat .h1{left:calc(50% - 700px);top:30%}
.si .heat .h2{left:calc(50% - 20px);top:18%}
.si .heat .h3{left:calc(50% - 300px);top:56%}
.si-main{padding-block:clamp(4px,1svh,14px) clamp(14px,2.4svh,28px)}
.si .hero-h{max-width:none;margin-top:clamp(12px,2.2svh,22px)}
.si-main > .sec-k{margin-top:0}
.si .lede{max-width:36em;text-wrap:balance}
.si-priv span{text-wrap:balance}
.si-card{max-width:660px;margin-top:clamp(18px,3.4svh,34px)}
.si-card .card-in{padding:clamp(20px,3.2svh,30px) 34px clamp(18px,2.8svh,26px)}

/* the course so far: eight stops, the first one done */
.si-prog{display:flex;flex-direction:column;align-items:center;text-align:center}
.si-k{font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.si-dots{list-style:none;margin:clamp(10px,1.8svh,14px) 0 0;padding:0;display:flex;align-items:center}
.si-dots li{position:relative;flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#FFFFFF;border:1.5px solid var(--line2);font-size:13.5px;font-weight:700;color:var(--mut);font-variant-numeric:tabular-nums}
.si-dots li + li{margin-left:18px}
.si-dots li + li::before{content:"";position:absolute;right:calc(100% + 1.5px);top:50%;width:18px;height:2px;margin-top:-1px;background:var(--line2)}
.si-dots li.ok{background:var(--go);border-color:var(--go);color:#FFFFFF;box-shadow:0 8px 18px -10px rgba(20,110,60,.6)}
.si-dots li.nx{border-color:var(--red);color:var(--red);box-shadow:0 0 0 4px rgba(196,15,11,.10)}
.si-dots li.nx::before{background:linear-gradient(90deg,var(--go),var(--red))}
.si-prog p{margin:clamp(10px,1.8svh,14px) 0 0;font-size:16px;line-height:1.45;color:var(--ink2)}
.si-prog p b{color:var(--ink);font-weight:650}

/* three short reasons */
.si-why{list-style:none;margin:clamp(16px,2.8svh,24px) 0 0;padding:clamp(16px,2.8svh,22px) 0 0;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.si-why li{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:0 4px}
.si-ic{flex:none;width:46px;height:46px;border-radius:14px;background:#FFF1EE;color:var(--red);display:grid;place-items:center;margin-bottom:6px}
.si-why b{font-size:16px;font-weight:650;line-height:1.3;letter-spacing:-.005em;color:var(--ink);text-wrap:balance}

/* the one action, and what happens to your details */
.si-act{margin-top:clamp(18px,3svh,26px)}
/* Google's dark button: ink pill, the G on a white disc, as Google draws it */
.si-act .gbtn{position:relative;width:100%;height:58px;padding:0 64px;font-size:17.5px;font-weight:650;border-radius:999px;border:0;background:var(--ink);color:#FFFFFF;text-decoration:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 1px 2px rgba(23,17,15,.3),0 16px 32px -14px rgba(23,17,15,.55);transition:background .15s,transform .15s,box-shadow .2s}
.si-act .gbtn:hover{background:#000000;transform:translateY(-1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 2px 4px rgba(23,17,15,.3),0 20px 36px -14px rgba(23,17,15,.6)}
.si-act .gbtn:focus-visible{outline:3px solid var(--red);outline-offset:3px}
.g-disc{position:absolute;left:7px;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:#FFFFFF;display:grid;place-items:center}
.g-disc svg{width:21px;height:21px}
.g-go{position:absolute;right:22px;top:50%;margin-top:-9px;opacity:.7;transition:transform .2s,opacity .2s}
.si-act .gbtn:hover .g-go{opacity:1;transform:translateX(2px)}
/* the script after site.js marks the Sign in link as the current page */
.si .signin[aria-current="page"]{border-color:var(--ink)}
.si-priv{display:flex;align-items:center;justify-content:center;gap:9px;margin:clamp(12px,2svh,16px) 0 0;font-size:14.5px;line-height:1.4;color:var(--mut);text-align:left}
.si-priv svg{flex:none;color:var(--ok)}
.si .alt{margin-top:clamp(14px,2.4svh,22px)}

/* footer base line, as on the other single-screen pages */
.si-base{position:relative;z-index:1}
.si-base .foot-base{align-items:center}
.si-base a{color:var(--ink2);text-decoration:none}
.si-base a:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.si-base nav a{display:inline-flex;align-items:center;min-height:32px}

@media (max-height:800px){
  @container app (min-width:861px){
    .si-ic{width:42px;height:42px;margin-bottom:4px}
    .si .hero-h{font-size:clamp(38px,7.2svh,64px)}
    .si-k{display:none}
    .si-dots{margin-top:0}
    .si-base .foot-base{padding-block:10px 14px}
  }
}

/* phone */
@container app (max-width:860px){
  .si .heat .h1{left:-380px;top:34%}.si .heat .h2{left:-60px;top:14%}.si .heat .h3{left:-200px;top:62%}
  .si-main{padding-block:0 clamp(10px,2svh,18px)}
  .si .hero-h{margin-top:12px;font-size:clamp(32px,4.6svh,38px)}
  .si-main > .sec-k{height:32px;font-size:13.5px}
  .g-disc{left:6px;width:42px;height:42px}
  .g-go{right:20px}
  .si .lede{font-size:16.5px;line-height:1.5}
  .si-card{margin-top:clamp(16px,2.6svh,24px)}
  .si-card .card-in{padding:18px 16px 16px}
  .si-k{display:none}
  .si-dots{margin-top:0}
  .si-dots li{width:30px;height:30px;font-size:12.5px}
  .si-dots li + li{margin-left:10px}
  .si-dots li + li::before{width:10px}
  .si-prog p{font-size:15px}
  .si-why{grid-template-columns:minmax(0,1fr);gap:4px;padding-top:12px;margin-top:14px}
  .si-why li{flex-direction:row;align-items:center;text-align:left;gap:14px;padding:6px 2px}
  .si-ic{width:40px;height:40px;border-radius:12px;margin:0}
  .si-ic svg{width:21px;height:21px}
  .si-why b{font-size:16px}
  .si-act{margin-top:14px}
  .si-act .gbtn{height:56px;font-size:17px}
  .si-priv{display:block;font-size:14px;text-align:center;text-wrap:balance}
  .si-priv svg{display:inline-block;vertical-align:-4px;margin-right:6px}
  .si .alt{margin-top:14px}
  .si-base .foot-base{flex-wrap:nowrap;align-items:center;padding-block:10px 14px;font-size:13px;gap:12px}
  .si-base nav{gap:14px}
}
@container app (max-width:420px){
  .si-base .mk{display:none}
}
@container app (max-width:380px){
  .si-dots li{width:28px;height:28px;font-size:12px}
  .si-dots li + li{margin-left:9px}
  .si-dots li + li::before{width:9px}
}
@media (max-height:780px){
  @container app (max-width:860px){
    .si-why li{padding-block:4px}
  }
}
@media (max-height:700px){
  @container app (max-width:860px){
    .si .lede{display:none}
    .si-main > .sec-k{display:none}
    .si .hero-h{margin-top:0}
    .si-card{margin-top:14px}
    .si-prog p{margin-top:10px}
    .si-why{margin-top:12px;padding-top:10px}
    .si-ic{width:36px;height:36px}
    .si-ic svg{width:19px;height:19px}
    .si-act .gbtn{height:54px}
    .si-base .foot-base{padding-block:8px 12px}
  }
}
</style>

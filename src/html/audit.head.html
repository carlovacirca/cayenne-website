<style>
/* audit.html only. Four scroll stops: 1 the intake card (five questions, then the analysis and the ready report),
   2 what the report shows, 3 how it works, 4 questions with the footer. */

/* ---------- 1 · hero and the intake card ---------- */
.hero-h em{font-family:var(--disp);font-style:italic;font-weight:400;font-size:1.12em;letter-spacing:-.015em;color:var(--red)}
.a-hero .hero-h{margin-top:clamp(12px,2.2svh,22px)}
.a-hero.working .hero-h{max-width:16ch}
.a-hero .card{max-width:760px}
.a-hero .lede{text-wrap:balance}
.cz-tip{margin:-6px 0 clamp(12px,1.8svh,16px);font-size:14.5px;color:var(--mut)}
.field > svg{color:var(--ink2)}
.fld-note{display:flex;align-items:center;justify-content:center;gap:7px;margin:12px 0 0;font-size:14.5px;color:var(--mut)}
.fld-note svg{flex:none;color:var(--mut)}
.btn-next[aria-disabled="true"]{background:#EEE8E4;color:#6E635D;cursor:not-allowed}
.btn-next[aria-disabled="true"]:hover{background:#EEE8E4}
.cz .s2-err{margin:12px 0 0}
.alt{display:inline-flex;align-items:center;gap:8px;color:var(--mut)}
.alt svg{flex:none}
.ch .i-rd{opacity:1}

/* the analysis: ticking steps and a live percentage */
.an{display:flex;flex-direction:column;gap:clamp(14px,2.2svh,18px);padding-bottom:clamp(20px,3svh,28px)}
.an-head{display:flex;align-items:center;gap:14px}
.an-ic{flex:none;position:relative;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#FFF1EE;color:var(--red)}
.an-ic::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid transparent;border-top-color:#FF6A3D;border-right-color:rgba(255,106,61,.35);animation:spin 1.1s linear infinite}
.an-bar{display:flex;align-items:center;gap:14px}
.an-bar .ld-bar{flex:1}
.an-bar .ld-bar i{transition:none;width:3%}
.an-bar b{min-width:4.2ch;text-align:right;font-size:17px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}

/* your report is ready */
.rdy-big{display:flex;align-items:baseline;justify-content:center;gap:12px;margin:2px 0 0}
.rdy-big .rp-lbl{max-width:27ch;text-align:left;text-wrap:balance}
.rdy-list{list-style:none;width:100%;margin:clamp(12px,2svh,18px) 0 0;padding:6px;display:flex;flex-direction:column;gap:2px;border-radius:20px;background:var(--soft);border:1px solid var(--line);text-align:left}
.rdy-list li{display:grid;grid-template-columns:28px minmax(0,1fr) auto 52px;gap:12px;align-items:center;min-height:44px;padding:0 12px 0 8px;border-radius:14px;font-size:16px;color:var(--ink)}
.rdy-list li:first-child{background:#FFFFFF;box-shadow:0 6px 16px -12px rgba(40,15,8,.4)}
.rdy-list .rn{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#FFFFFF;border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--ink2)}
.rdy-list li:first-child .rn{background:var(--red);border-color:var(--red);color:#FFFFFF}
.rdy-list .rt{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rdy-list .re{font-size:13px;font-weight:600;color:var(--mut)}
.rdy-list b{text-align:right;font-variant-numeric:tabular-nums}
.btn-back svg{flex:none}

/* ---------- 2 · what you get ---------- */
.s-get .heat .h1{width:780px;height:640px;left:-220px;top:8%;background:radial-gradient(closest-side,var(--heat1),rgba(255,92,56,0))}
.s-get .heat .h2{width:620px;height:520px;right:-200px;bottom:-120px;background:radial-gradient(closest-side,var(--heat2),rgba(255,170,80,0))}
.s-get,.s-how{padding-bottom:calc(clamp(28px,6svh,72px) + 56px)}
.get{display:grid;grid-template-columns:minmax(0,470px) minmax(0,1fr);grid-template-areas:"rep head" "rep list";column-gap:clamp(48px,7cqi,112px);align-items:center;align-content:center}
.get-head{grid-area:head;align-self:end}
.get-list{grid-area:list;align-self:start}
.get .report{grid-area:rep;margin-left:16px}
.co{list-style:none;margin:clamp(18px,3.2svh,30px) 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.co li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:3px 16px;align-items:start;padding:clamp(10px,1.6svh,14px) 18px clamp(10px,1.6svh,14px) 12px;border-radius:20px;border:1px solid transparent;transition:background .2s,border-color .2s,box-shadow .2s}
.co li:hover{background:#FFFFFF;border-color:var(--line);box-shadow:0 14px 32px -26px rgba(40,15,8,.45)}
.co .mk{grid-row:1 / 3;margin-top:-3px}
.co b{font-size:18px;font-weight:650;letter-spacing:-.01em;color:var(--ink)}
.co p{margin:0;font-size:16px;line-height:1.5;color:var(--ink2)}
.mk{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--red);color:#FFFFFF;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;box-shadow:0 0 0 3px #FFFFFF,0 8px 18px -6px rgba(196,15,11,.55)}
.report .mk{position:absolute;left:-41px;top:50%;margin-top:-16px;transition:transform .25s cubic-bezier(.2,.75,.25,1),box-shadow .25s}
.rp-big,.rp-bw,.rp-first{position:relative}
.rp-bw{margin-top:16px}
.rp-bw .rp-bars{margin-top:0}
.rp-big,.rp-bw,.rp-first{transition:background .25s,box-shadow .25s;border-radius:12px}
.get:has(.co li:nth-child(1):hover) .rp-big,.get:has(.co li:nth-child(2):hover) .rp-bw{background:#FFF8F6;box-shadow:0 0 0 10px #FFF8F6}
.get:has(.co li:nth-child(3):hover) .rp-first{box-shadow:0 0 0 5px #FFF8F6}
.get:has(.co li:nth-child(1):hover) .rp-big .mk,.get:has(.co li:nth-child(2):hover) .rp-bw .mk,.get:has(.co li:nth-child(3):hover) .rp-first .mk{transform:scale(1.12);box-shadow:0 0 0 3px #FFFFFF,0 0 0 9px rgba(196,15,11,.14)}
.rp-first .mk{left:-39px}

/* ---------- 3 · how it works ---------- */
.s-how .heat .h1{width:1000px;height:520px;left:calc(50% - 500px);top:42%;background:radial-gradient(closest-side,var(--heat2),rgba(255,170,80,0))}
.s-how .sec-sub{text-wrap:balance}
.how{grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;max-width:1080px;margin-inline:auto}
.how::before,.how::after{left:16.66%;right:16.66%}
.how .ps{padding:0 6px}
.how .ps p{max-width:28ch}
.vg{width:100%;max-width:290px;height:clamp(96px,13svh,118px);margin-top:clamp(14px,2.4svh,22px);padding:12px;border-radius:20px;background:#FFFFFF;border:1px solid var(--line);box-shadow:0 2px 6px rgba(20,12,8,.03),0 24px 44px -30px rgba(120,30,10,.38);display:flex;flex-direction:column;justify-content:center;gap:7px;text-align:left}
.vg-1{flex-direction:row;flex-wrap:wrap;align-content:center;justify-content:center;gap:6px}
.mc{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 11px 0 6px;border-radius:999px;border:1.5px solid var(--line2);background:#FFFFFF;font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap}
.mc i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--ink2)}
.mc.on{background:var(--go);border-color:var(--go);color:#FFFFFF}
.mc.on i{background:rgba(255,255,255,.2);color:#FFFFFF}
.mb{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;font-size:13px;color:var(--ink2)}
.how .vg b{margin:0;font-size:13px;font-weight:700;letter-spacing:0;color:var(--ink);font-variant-numeric:tabular-nums}
.mb s{grid-column:1 / -1;height:6px;border-radius:3px;background:var(--soft);overflow:hidden;text-decoration:none}
.mb s i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--red),#FF7A45)}
.pl{display:flex;align-items:center;gap:9px;height:28px;padding:0 10px 0 4px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--ink)}
.pl:first-child{background:#FFF6F4}
.pl span{flex:none;min-width:52px;height:22px;padding:0 8px;border-radius:999px;display:grid;place-items:center;background:var(--soft);font-size:11.5px;font-weight:700;letter-spacing:.04em;color:var(--ink2)}
.pl:first-child span{background:var(--red);color:#FFFFFF}
.how-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px 20px;margin-top:clamp(22px,4svh,44px)}

/* ---------- 4 · questions, the last call to start, and the footer ---------- */
.s-q{justify-content:space-between}
.s-q .heat .h1{width:820px;height:600px;left:calc(50% - 760px);top:-6%;background:radial-gradient(closest-side,var(--heat1),rgba(255,92,56,0))}
.s-q .heat .h2{width:640px;height:520px;right:-180px;top:20%;background:radial-gradient(closest-side,var(--heat2),rgba(255,170,80,0))}
.q-main{position:relative;z-index:1;flex:1;display:flex;align-items:center}
.q-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,640px);grid-template-areas:"head faq" "cta faq";column-gap:clamp(40px,6cqi,96px);align-items:center;align-content:center;width:100%}
.q-head{grid-area:head;align-self:end}
.q-cta{grid-area:cta;align-self:start;margin-top:clamp(20px,3.4svh,30px)}
.q-grid .faq{grid-area:faq;margin-top:0;max-width:none}
.q-p{margin:16px 0 0;max-width:30em;font-size:clamp(17px,2.3svh,19px);line-height:1.6;color:var(--ink2)}

/* ---------- phone and tablet ---------- */
@container app (max-width:1100px){
  .get{grid-template-columns:minmax(0,420px) minmax(0,1fr);column-gap:56px}
  .q-grid{grid-template-columns:minmax(0,1fr) minmax(0,520px)}
}
@container app (max-width:860px){
  .a-hero .hero-h{margin-top:12px}
  .cz-tip{font-size:14px;margin:-4px 0 12px}
  .fld-note{font-size:14px;margin-top:10px}
  .an-ic{width:42px;height:42px}
  .an-bar b{font-size:16px}
  .rdy-big .rp-num{font-size:40px}
  .rdy-list{padding:4px;border-radius:18px}
  .rdy-list li{grid-template-columns:26px minmax(0,1fr) 44px;gap:10px;min-height:42px;padding:0 10px 0 6px;font-size:15px}
  .rdy-list .rn{width:26px;height:26px;font-size:12.5px}
  .rdy-list .re{display:none}
  .btn-back{padding:0 16px 0 12px}
  .bk-re{width:52px;padding:0}
  .bk-t{display:none}
  .an .ld-title{font-size:18px}
  .an .ld-steps{gap:10px}
  .an .ld-steps li{font-size:15.5px;gap:10px}
  .rdy-big .rp-lbl{max-width:18ch}

  .get{grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "rep" "list";row-gap:0}
  .get .report{margin:18px 0 0 14px}
  .get-head .sec-sub{display:none}
  .co{margin-top:10px;gap:0}
  .co li{grid-template-columns:28px minmax(0,1fr);column-gap:12px;padding:6px 4px}
  .co li:hover{background:transparent;border-color:transparent;box-shadow:none}
  .co .mk{width:28px;height:28px;font-size:13px;margin-top:0}
  .co b{font-size:16.5px}
  .co p{font-size:14.5px;line-height:1.38}
  .report .mk{width:28px;height:28px;font-size:13px;left:-33px;margin-top:-14px}
  .rp-first .mk{left:-33px}
  .get .rp-biz{display:none}
  .get .rp-first{display:flex;margin-top:14px;padding:10px 12px;font-size:14.5px}
  .get .rp-bars li:nth-child(n+3){display:none}

  .vg{display:none}
  .how{grid-template-columns:minmax(0,1fr);gap:0}
  .how::before,.how::after{left:21px;right:auto;bottom:var(--tail,34px)}
  .how .ps{padding:0 0 12px}
  .how .ps p{max-width:none}
  .s-get,.s-how{padding-bottom:calc(clamp(18px,3.2svh,40px) + 72px)}
  .how-foot{margin-top:6px;width:100%}
  .how-foot .btn-primary{width:100%}
  .how-foot .note{display:none}

  .q-grid{grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "faq" "cta"}
  .q-head .q-p{display:none}
  .q-grid .faq{margin-top:16px}
  .q-cta{margin-top:14px}
  .q-cta .btn-create{width:100%}
  .q-cta .note{display:none}
  .s-q .foot{margin-top:18px}
  .s-q{padding-top:22px}
  .q-grid .faq summary{min-height:50px}
  .q-grid .faq{gap:6px}
  .s-q .foot-brand p{display:none}
  .s-q .foot ul li:nth-child(4){display:none}
  .s-q .foot-in{padding-block:16px 10px}
  /* while an answer is open on a phone, the footer links step aside so the screen still holds it; they come back when it closes */
  .s-q:has(details[open]) .foot-in{display:none}
  .s-q:has(details[open]) .q-cta{margin-top:10px}
  .s-q:has(details[open]) .foot-base{border-top:0}
}
@container app (max-width:380px){
  .rdy-big .rp-lbl{font-size:14px}
}
/* shorter screens: secondary detail steps aside so every scroll stop stays one screen */
@media (max-height:900px){
  @container app (min-width:861px){
    .get .report{padding:22px}
  }
}
@media (max-height:820px){
  @container app (min-width:861px){
    .rdy-list li{min-height:40px}
    .rdy-list{margin-top:12px}
    .how .ps small{display:none}
  }
}
@media (max-height:780px){
  @container app (min-width:861px){
    .how .ps p{font-size:15.5px}
    .q-grid .faq summary{min-height:54px}
    .q-grid .faq{gap:8px}
    .s-q .foot{margin-top:18px}
    .s-q .foot-in{padding-block:20px 14px}
    .s-q .foot ul{gap:5px}
    .s-q .foot-base{padding-block:10px 16px}
  }
  @container app (max-width:860px){
    .co p{display:none}
    .co li{align-items:center;padding:5px 4px}
    .get .report{padding:16px}
    .get .rp-big{margin-top:10px}
  }
}
@media (max-height:740px){
  @container app (max-width:860px){
    .an{gap:12px}
    .ld-steps{gap:9px}
    .ld-steps li{font-size:15.5px}
    .s-q .foot-in{padding-block:14px 10px;gap:12px 20px}
    .s-q .foot ul li:nth-child(4){display:none}
    .s-q .foot-base{padding-block:8px 12px}
    .q-grid .faq summary{min-height:48px}
    .q-grid .faq{gap:6px}
    .s-q .sec-k{display:none}
    .s-q .sec-h{margin-top:0}
    .s-how .sec-sub{display:none}
  }
}
@media (max-height:700px){
  @container app (max-width:860px){
    .cz-tip{display:none}
    .rdy-list li{min-height:38px}
    .get .rp-bars li:nth-child(n+2){display:none}
    .get .rp-first{margin-top:12px}
    .get .rp-bw{margin-top:10px}
    .app .how .ps p{display:block}
    .s-q .foot{margin-top:12px}
    .s-q .foot-in > div:not(.foot-brand){display:none}
    .s-q .foot-in{padding-block:14px 8px}
    .s-q:has(details[open]) .foot{display:none}
  }
  @container app (min-width:861px){
    .how .ps p{display:block}
  }
}
@media (max-height:660px){
  @container app (max-width:860px){
    .rdy-big .rp-num{font-size:34px}
    .s-q .foot-in > div:not(.foot-brand){display:none}
  }
}
</style>

<style>
/* Layout: five full-screen scroll stops in the Glow look. 1 the course creator, 2 how the course works,
   3 the free AI audit, 4 services, 5 why free plus the footer. White ground, warm heat light, one red accent.
   Container queries drive the phone layout so the Phone view toggle works on a desktop screen. */
:root{
  --bg:#FFFFFF; --ink:#17110F; --ink2:#4B413D; --mut:#6B605B; --ph:#776C66; --line:#ECE6E1; --line2:#D8CFC9; --soft:#F8F5F2;
  --red:#C40F0B; --red-h:#A30C08; --go:#1E7B45; --ring:rgba(196,15,11,.22); --chip:#FBEDEB; --chip-ink:#8F0A07; --ok:#2E6A2A; --okbg:#E8F3E5;
  --heat1:rgba(255,92,56,.28); --heat2:rgba(255,170,80,.28); --heat3:rgba(255,110,140,.18);
  --chrome:#1C1715; --chrome-fg:#F7F2EE; --stage:#2B2624;
  --ui:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --disp:'Instrument Serif',Georgia,'Times New Roman',serif;
  --r:16px; --gut:32px; --topbar:36px;
  color-scheme: light;
}
*{box-sizing:border-box}
html{scroll-snap-type:y proximity;scroll-padding-top:var(--topbar)}
body{margin:0;padding-top:var(--topbar);background:var(--bg);color:var(--ink);font-family:var(--ui);-webkit-font-smoothing:antialiased}
body.phone{background:var(--stage)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
img{max-width:100%}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- prototype strip ---------- */
.proto{position:fixed;top:0;left:0;right:0;z-index:100;height:var(--topbar);display:flex;align-items:center;gap:6px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));background:var(--chrome);color:var(--chrome-fg);font:600 13px var(--ui);overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.proto::-webkit-scrollbar{display:none}
.pr-tag{flex:none;margin-right:6px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#B8ADA6}
.pr-btn{flex:none;height:28px;padding:0 12px;border-radius:8px;border:0;background:rgba(255,255,255,.08);color:inherit;font:inherit}
.pr-btn:hover{background:rgba(255,255,255,.16)}
.pr-btn[aria-pressed="true"]{background:rgba(255,138,112,.25);color:#FFC3B5}
.pr-ai{flex:none;display:flex;align-items:center;gap:7px;height:28px;padding:0 10px;border-radius:8px;cursor:pointer}
.pr-ai input{width:16px;height:16px;accent-color:#FF8A70}
.proto :focus-visible{outline:2px solid #FF8A70;outline-offset:1px}

/* ---------- stage and phone frame ---------- */
#stage{overflow-x:clip}
#stage.phone{display:flex;justify-content:center;align-items:flex-start;padding:28px 16px 120px;background:var(--stage)}
#stage.phone .app{width:390px;max-width:100%;border-radius:46px;overflow:clip;box-shadow:0 0 0 10px #0E0C0B,0 0 0 11px #3A3431,0 40px 90px rgba(0,0,0,.55)}
.app{position:relative;container:app / inline-size;background:var(--bg);color:var(--ink);font-family:var(--ui)}
.app :focus-visible{outline:3px solid var(--red);outline-offset:2px}
.wrap{width:100%;max-width:1240px;margin-inline:auto;padding-left:max(var(--gut),env(safe-area-inset-left,0px));padding-right:max(var(--gut),env(safe-area-inset-right,0px))}

/* ---------- scroll stops ---------- */
.snap{position:relative;min-height:calc(100svh - var(--topbar));scroll-snap-align:start;overflow:clip}
.sec{display:flex;flex-direction:column;justify-content:center;padding-block:clamp(28px,6svh,72px)}
.sec + .sec{border-top:1px solid var(--line)}
.heat{position:absolute;inset:0;pointer-events:none;z-index:0}
.heat i{position:absolute;border-radius:50%}
.sec > .wrap{position:relative;z-index:1}
.sec-k{display:inline-flex;align-items:center;gap:9px;height:34px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.85);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--ink2)}
.sec-k i{width:7px;height:7px;border-radius:50%;background:var(--red)}
.sec-h{margin:18px 0 0;font-size:clamp(34px,min(4.6cqi,7svh),60px);line-height:1.02;font-weight:600;letter-spacing:-.04em;text-wrap:balance;color:var(--ink)}
.sec-h em{font-family:var(--disp);font-style:italic;font-weight:400;font-size:1.1em;letter-spacing:-.01em;color:var(--red)}
.sec-sub{margin:16px 0 0;max-width:36em;font-size:clamp(17px,2.3svh,20px);line-height:1.55;color:var(--ink2)}
.center{text-align:center;display:flex;flex-direction:column;align-items:center}
.cta-row{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
.note{font-size:15px;color:var(--mut)}
.intro .in{animation:rise .8s cubic-bezier(.2,.75,.25,1) both}
.intro .d1{animation-delay:.07s}.intro .d2{animation-delay:.15s}.intro .d3{animation-delay:.24s}.intro .d4{animation-delay:.34s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- nav ---------- */
.nav{position:relative;z-index:5}
.nav-in{display:flex;align-items:center;gap:28px;padding-block:clamp(10px,1.8svh,18px)}
.brand{display:flex;align-items:center;flex:none}
.brand img{width:128px;height:auto;display:block}
.links{display:flex;gap:30px;margin-left:auto;font-size:16px;font-weight:500}
.links a{text-decoration:none;color:var(--ink2)}
.links a:hover{color:var(--ink)}
.signin{flex:none;display:inline-flex;align-items:center;height:42px;padding:0 18px;border-radius:999px;border:1px solid var(--line2);text-decoration:none;font-weight:600;font-size:15px;color:var(--ink);background:#FFFFFF}
.signin:hover{border-color:var(--ink)}
.menu{display:none;margin-left:auto;width:44px;height:44px;border-radius:12px;border:1px solid var(--line2);background:#FFFFFF;align-items:center;justify-content:center}

/* ---------- hero ---------- */
.hero{display:flex;flex-direction:column}
.hero .heat .h1{width:760px;height:620px;left:calc(50% - 640px);top:32%;background:radial-gradient(closest-side,var(--heat1),rgba(255,92,56,0));animation:drift1 24s ease-in-out infinite alternate}
.hero .heat .h2{width:720px;height:600px;left:calc(50% - 60px);top:24%;background:radial-gradient(closest-side,var(--heat2),rgba(255,170,80,0));animation:drift2 28s ease-in-out infinite alternate}
.hero .heat .h3{width:600px;height:480px;left:calc(50% - 300px);top:58%;background:radial-gradient(closest-side,var(--heat3),rgba(255,110,140,0));animation:drift1 32s ease-in-out infinite alternate-reverse}
@keyframes drift1{to{transform:translate(90px,-40px) scale(1.08)}}
@keyframes drift2{to{transform:translate(-90px,50px) scale(.94)}}
.hero-main{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-block:clamp(0px,1svh,14px) clamp(18px,3svh,40px)}
.pill{display:inline-flex;align-items:center;gap:10px;padding:4px 4px 4px 18px;border-radius:999px;background:rgba(255,255,255,.86);border:1px solid var(--line);box-shadow:0 8px 22px -12px rgba(60,20,10,.25);font-size:15px;font-weight:600;color:var(--ink2)}
/* the AI window: "Learn" stays put while the tool inside swipes to the next one. Every tool sits in the same grid cell,
   so the window is always as wide as the longest name and nothing around it moves. */
.rot{display:block;height:34px;border-radius:999px;background:var(--soft);border:1px solid var(--line)}
.rot-track{display:grid;height:100%;overflow:hidden;border-radius:inherit;-webkit-mask-image:linear-gradient(90deg,transparent,#000 12px,#000 calc(100% - 12px),transparent);mask-image:linear-gradient(90deg,transparent,#000 12px,#000 calc(100% - 12px),transparent)}
.rot-item{grid-area:1 / 1;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 16px 0 13px;white-space:nowrap;font-weight:650;color:var(--ink);opacity:0;transform:translateX(100%)}
.rot-item img{flex:none;width:20px;height:20px}
.rot-all{gap:6px}
.rot-item.on{opacity:1;transform:none;transition:transform .75s cubic-bezier(.5,0,.2,1),opacity .5s ease-out .12s}
.rot-item.out{opacity:0;transform:translateX(-100%);transition:transform .75s cubic-bezier(.5,0,.2,1),opacity .5s cubic-bezier(.4,0,.9,.6)}
.trio{display:flex;flex:none}
.trio span{width:34px;height:34px;border-radius:50%;background:#FFFFFF;border:1px solid var(--line);display:grid;place-items:center;margin-left:-9px}
.trio span:first-child{margin-left:0}
.trio img{width:19px;height:19px}
.hero-h{margin:clamp(10px,2svh,22px) 0 0;max-width:16ch;font-size:clamp(38px,min(5.6cqi,7.4svh),76px);line-height:1;font-weight:600;letter-spacing:-.045em;text-wrap:balance;color:var(--ink)}
.slot{font-family:var(--disp);font-style:italic;font-weight:400;font-size:1.12em;letter-spacing:-.015em;color:var(--red)}
.slot.morph{display:inline-block;animation:morph .9s cubic-bezier(.2,.75,.25,1)}
@keyframes morph{from{opacity:0;filter:blur(10px);transform:translateY(6px)}to{opacity:1;filter:none;transform:none}}
.lede{margin:clamp(10px,1.8svh,18px) 0 0;max-width:46em;font-size:clamp(17px,2.3svh,20px);line-height:1.55;color:var(--ink2)}
.lede-w,.alt-w{display:grid;grid-template-rows:1fr;transition:grid-template-rows .5s cubic-bezier(.2,.75,.25,1),opacity .35s}
.lede-w > div,.alt-w > div{min-height:0;overflow:hidden}
.working .lede-w,.working .alt-w{grid-template-rows:0fr;opacity:0}
.working .hero-h{max-width:24ch}
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes ang{to{--ang:360deg}}
.card{position:relative;isolation:isolate;width:100%;max-width:780px;margin-top:clamp(16px,3svh,32px);border-radius:30px;padding:1.5px;text-align:left;background:conic-gradient(from var(--ang),rgba(255,106,61,0) 0deg,rgba(255,106,61,0) 200deg,#FF6A3D 285deg,#FFB35C 325deg,rgba(255,179,92,0) 360deg),linear-gradient(var(--line),var(--line));animation:ang 9s linear infinite;box-shadow:0 40px 90px -36px rgba(120,30,10,.30)}
.card::before{content:"";position:absolute;inset:-18px;border-radius:48px;z-index:-1;background:conic-gradient(from var(--ang),rgba(255,106,61,0) 0deg,rgba(255,106,61,0) 200deg,rgba(255,106,61,.40) 285deg,rgba(255,179,92,.34) 325deg,rgba(255,179,92,0) 360deg);filter:blur(24px);animation:ang 9s linear infinite}
.card.is-loading,.card.is-loading::before{animation-duration:2.2s}
.card-in{background:#FFFFFF;border-radius:28.5px;padding:clamp(16px,2.4svh,24px) 32px 0}
.alt{margin:clamp(12px,2.2svh,22px) 0 0;font-size:16px;color:var(--ink2)}
.alt a{color:var(--ink);font-weight:600;text-underline-offset:4px}

/* the course creator: one question at a time inside the card, so nothing ever needs a scroll.
   Everything is centred to match the hero, and every control is fully rounded. */
.cz{display:flex;flex-direction:column;align-items:center;text-align:center}
.cz-head{display:flex;align-items:center;justify-content:center;gap:10px;max-width:100%;margin:0 0 clamp(12px,2svh,18px)}
.num{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--ink);color:#FFFFFF;font-variant-numeric:tabular-nums}
.num.ok{background:var(--go)}
.cz-q{margin:0;font-size:20px;font-weight:650;line-height:1.25;letter-spacing:-.01em;text-wrap:balance;color:var(--ink)}
.cz-q:focus{outline:0}
.cz-body{width:100%}
.cz-in{animation:slidein .42s cubic-bezier(.2,.75,.25,1) both}
.cz-in.back{animation-name:slideback}
@keyframes slidein{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
@keyframes slideback{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:none}}
.card-in.sizing{overflow:clip}
.combo{position:relative;width:100%;text-align:left}
.field{display:flex;align-items:center;gap:12px;height:60px;padding:0 8px 0 22px;border-radius:999px;border:1.5px solid var(--line2);background:#FFFFFF;transition:border-color .15s,box-shadow .15s}
.field:focus-within{border-color:var(--ink);box-shadow:0 0 0 4px var(--ring)}
.field > svg{flex:none}
.field input{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;font-size:19px;color:var(--ink)}
.field input::placeholder{color:var(--ph)}
.app .field input:focus-visible{outline:0}
.clear{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:var(--mut);display:grid;place-items:center}
.clear:hover{background:var(--soft)}
.pop{position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:40;background:#FFFFFF;border:1px solid var(--line);border-radius:18px;box-shadow:0 2px 6px rgba(20,12,8,.06),0 28px 64px -16px rgba(20,12,8,.28);overflow:hidden;animation:popin .16s ease-out;text-align:left}
@keyframes popin{from{opacity:0;transform:translateY(-4px) scale(.985)}to{opacity:1;transform:none}}
.pop-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px 4px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.biz-list{list-style:none;margin:0;padding:4px 6px 6px;max-height:330px;overflow:auto}
.biz-opt{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px;border-radius:12px;cursor:pointer}
.biz-opt[aria-selected="true"],.biz-opt:hover{background:var(--soft)}
.bo-pin{width:40px;height:40px;border-radius:12px;background:#FDEEEC;display:grid;place-items:center}
.bo-main{display:flex;flex-direction:column;min-width:0}
.bo-main b{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.bo-main b mark{background:transparent;color:var(--red);font-weight:700}
.bo-main span{font-size:14.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bo-rate{font-size:14px;color:var(--ink2);white-space:nowrap;font-variant-numeric:tabular-nums}
.st{color:#D69200}
.none{padding:14px 12px;font-size:15px;line-height:1.45;color:var(--mut);list-style:none}
.pop-foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 12px;padding:8px 16px;border-top:1px solid var(--line);background:var(--soft)}
.use-typed{min-height:40px;border:0;background:transparent;padding:0;font-weight:600;font-size:15px;color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-align:left}
.pbg{font-size:12.5px;color:var(--mut)}
.bizcard{display:flex;align-items:center;gap:14px;padding:12px 14px 12px 12px;border-radius:22px;border:1px solid var(--line);background:var(--soft);animation:settle .35s ease-out;text-align:left}
@keyframes settle{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}
.bc-map{flex:none;width:60px;height:60px;border-radius:12px;overflow:hidden;display:block}
.bc-map svg{display:block;width:100%;height:100%}
.bc-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.bc-name{font-size:18px;font-weight:650;color:var(--ink)}
.bc-sub{font-size:15px;color:var(--ink2)}
.bc-rate{font-size:14px;color:var(--mut);display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums}
.bc-rate .st{letter-spacing:1px}
.bc-change{flex:none;height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line2);background:#FFFFFF;font-weight:600;font-size:14.5px;color:var(--ink)}
.bc-change:hover{border-color:var(--ink)}

/* step 2: the options are fully rounded buttons in balanced, centred rows. Picked ones turn green. */
.s2-k{display:block;font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--red)}
.s2-k:focus{outline:0}
.s2-tip{margin:5px 0 0;font-size:14.5px;color:var(--mut)}
.chips{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:14px}
.crow{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:100%}
.ch{display:inline-flex;align-items:center;gap:9px;height:50px;max-width:100%;padding:0 20px 0 12px;border-radius:999px;border:1.5px solid var(--line2);background:#FFFFFF;font-size:16px;font-weight:600;color:var(--ink);white-space:nowrap;transition:background .22s,border-color .22s,color .22s,box-shadow .22s,transform .15s}
.ch:hover{border-color:var(--ink2);transform:translateY(-1px);box-shadow:0 10px 20px -14px rgba(40,15,8,.5)}
.ch:active{transform:scale(.97)}
.ch-ic{position:relative;flex:none;width:26px;height:26px;border-radius:50%;background:var(--soft);color:var(--ink2);transition:background .22s,color .22s}
.ch-ic svg{position:absolute;left:50%;top:50%;margin:-7px 0 0 -7px;transition:opacity .2s,transform .3s cubic-bezier(.2,.75,.25,1)}
.ch-ic .i-tk{opacity:0;transform:scale(.4) rotate(-40deg)}
.ch-t{overflow:hidden;text-overflow:ellipsis}
.app .ch:focus-visible,.app .lv:focus-visible{outline-color:var(--ink)}
.ch[aria-checked="true"]{background:var(--go);border-color:var(--go);color:#FFFFFF;box-shadow:0 8px 18px -12px rgba(20,110,60,.5)}
.ch[aria-checked="true"] .ch-ic{background:rgba(255,255,255,.2);color:#FFFFFF}
.ch[aria-checked="true"] .i-pl{opacity:0;transform:rotate(90deg) scale(.4)}
.ch[aria-checked="true"] .i-tk{opacity:1;transform:none}
.ch.bump,.lv.bump{animation:bump .34s cubic-bezier(.2,.75,.25,1)}
@keyframes bump{40%{transform:scale(1.06)}100%{transform:none}}
.ch-add{border-style:dashed;background:transparent;color:var(--ink2)}
.ch-own{display:inline-flex;align-items:center;gap:6px;height:50px;max-width:100%;padding:0 5px 0 20px;border-radius:999px;border:1.5px solid var(--ink);background:#FFFFFF;box-shadow:0 0 0 4px var(--ring);animation:settle .25s ease-out}
.ch-own input{flex:1;width:230px;min-width:0;height:100%;border:0;outline:0;background:transparent;font-size:16px;color:var(--ink)}
.ch-own input::placeholder{color:var(--ph)}
.app .ch-own input:focus-visible{outline:0}
.ch-own button{flex:none;height:38px;padding:0 16px;border-radius:999px;border:0;background:var(--ink);color:#FFFFFF;font-weight:650;font-size:15px}
.s2-err{margin:12px 0 0;font-size:15px;font-weight:600;color:var(--red)}

/* step 3 */
.lv-wrap{display:inline-flex;flex-direction:column;max-width:100%}
.lvl{display:flex;justify-content:center;gap:10px}
.lv{flex:none;width:54px;height:54px;border-radius:50%;border:1.5px solid var(--line2);background:#FFFFFF;font-size:20px;font-weight:650;color:var(--ink);font-variant-numeric:tabular-nums;transition:background .22s,border-color .22s,color .22s,box-shadow .22s,transform .15s}
.lv:hover{border-color:var(--ink2);transform:translateY(-1px)}
.lv[aria-checked="true"]{background:var(--go);border-color:var(--go);color:#FFFFFF;box-shadow:0 8px 18px -12px rgba(20,110,60,.5)}
.lv-ends{display:flex;justify-content:space-between;gap:12px;margin-top:8px;font-size:13.5px;color:var(--mut)}
.lv-desc{margin:12px 0 0;font-size:16px;line-height:1.45;color:var(--ink2);min-height:24px;text-wrap:balance}
.lv-desc b{color:var(--ink)}

/* the footer holds the one next action, always in the same place. Its top edge is the quiet loading line
   that fills as each part of the course is chosen. */
.cfoot{position:sticky;bottom:0;z-index:3;margin:clamp(16px,2.6svh,24px) -32px 0;padding:16px 32px clamp(16px,2.4svh,22px);background:#FFFFFF;border-radius:0 0 28.5px 28.5px}
.cf-row{display:flex;gap:10px}
.cf-row > :last-child{flex:1}
.btn-back{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:56px;padding:0 22px 0 16px;border-radius:999px;border:1.5px solid var(--line2);background:#FFFFFF;font-weight:600;font-size:16px;color:var(--ink);transition:border-color .15s}
.btn-back:hover{border-color:var(--ink)}
.btn-next{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:56px;padding:0 26px;border-radius:999px;border:0;background:var(--ink);color:#FFFFFF;font-weight:650;font-size:17px;white-space:nowrap;transition:background .15s,transform .15s}
.btn-next:hover{background:#000000}
.cfoot .btn-create{height:56px;border-radius:999px}
.cfoot .btn-create:hover{transform:none}
.pbar{position:absolute;left:0;right:0;top:0;height:3px;background:var(--line)}
.pbar i{position:absolute;left:0;top:0;bottom:0;border-radius:0 2px 2px 0;background:linear-gradient(90deg,#C40F0B,#FF6A3D 70%,#FFB35C);transition:width 1.2s cubic-bezier(.22,.8,.2,1)}
.pbar i::after{content:"";position:absolute;right:-11px;top:50%;width:22px;height:9px;margin-top:-4.5px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,179,92,.9),rgba(255,179,92,0));opacity:0;transition:opacity .4s}
.pbar.mid i::after{opacity:1}
.btn-create{white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:10px;height:58px;padding:0 28px;border-radius:18px;border:0;background:var(--red);color:#FFFFFF;font-size:18px;font-weight:650;text-decoration:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 1px 2px rgba(150,10,8,.3),0 14px 30px -8px rgba(196,15,11,.45);transition:transform .15s,background .15s,box-shadow .15s}
.btn-create:hover{background:var(--red-h);transform:translateY(-1px);color:#FFFFFF}
.btn-create[aria-disabled="true"]{background:#EEE8E4;color:#6E635D;box-shadow:none;transform:none;cursor:not-allowed}
.btn-create.go{animation:go .9s ease-out}
@keyframes go{0%{box-shadow:0 0 0 0 rgba(255,106,61,.55),0 14px 30px -8px rgba(196,15,11,.45)}100%{box-shadow:0 0 0 18px rgba(255,106,61,0),0 14px 30px -8px rgba(196,15,11,.45)}}
.btn-primary{white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:10px;height:54px;padding:0 24px;border-radius:14px;border:0;background:var(--ink);color:#FFFFFF;font-weight:650;font-size:17px;text-decoration:none}
.btn-primary:hover{background:#000000;color:#FFFFFF}
.btn-ghost{white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:54px;padding:0 20px;border-radius:14px;border:1.5px solid var(--line2);background:#FFFFFF;font-weight:600;font-size:16px;color:var(--ink);text-decoration:none}
.btn-ghost:hover{border-color:var(--ink)}
.nudge{animation:nudge .4s}
@keyframes nudge{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.link-btn{border:0;background:transparent;padding:8px 4px;font-weight:600;font-size:15px;color:var(--ink);text-decoration:underline;text-underline-offset:3px}

/* loading and ready */
.ld{display:flex;flex-direction:column;gap:18px;padding-bottom:26px}
.ld-head{display:flex;align-items:center;gap:16px}
.ld-trio{display:flex;flex:none}
.ld-trio span{width:46px;height:46px;border-radius:50%;background:#FFFFFF;border:1px solid var(--line);display:grid;place-items:center;margin-left:-10px;box-shadow:0 6px 14px -6px rgba(0,0,0,.2);animation:bob 1.6s ease-in-out infinite}
.ld-trio span:first-child{margin-left:0}
.ld-trio span:nth-child(2){animation-delay:.2s}.ld-trio span:nth-child(3){animation-delay:.4s}
.ld-trio img{width:24px;height:24px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.ld-title{font-size:21px;font-weight:650;color:var(--ink);line-height:1.25;text-wrap:balance}
.ld-note{font-size:14.5px;color:var(--mut);margin-top:2px}
.ld-steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.ld-steps li{display:flex;align-items:center;gap:12px;font-size:17px;color:var(--mut);transition:color .3s}
.ld-steps li.on{color:var(--ink);font-weight:600}
.ld-steps li.ok{color:var(--ink2)}
.ld-ic{width:24px;height:24px;border-radius:50%;border:2px solid var(--line2);flex:none;display:grid;place-items:center}
.ld-steps li.on .ld-ic{border-color:var(--red);border-right-color:transparent;animation:spin .8s linear infinite}
.ld-steps li.ok .ld-ic{border-color:var(--ok);background:var(--ok)}
.ld-steps li.ok .ld-ic::after{content:"";width:10px;height:5px;border-left:2px solid #FFFFFF;border-bottom:2px solid #FFFFFF;transform:translateY(-1px) rotate(-45deg)}
@keyframes spin{to{transform:rotate(360deg)}}
.ld-bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;border:1px solid var(--line)}
.ld-bar i{display:block;height:100%;width:4%;border-radius:4px;background:linear-gradient(90deg,var(--red),#FF7A45);transition:width .9s cubic-bezier(.3,.7,.3,1)}
.rd{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding-bottom:26px}
.rd-h{margin:4px 0 0;font-size:28px;line-height:1.15;letter-spacing:-.025em;font-weight:650;color:var(--ink)}
.rd-p{margin:0;font-size:16.5px;color:var(--ink2)}
.rd-list{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:16px;color:var(--ink2)}
.rd-list li{display:flex;gap:10px}
.rd-list li span{flex:none;width:22px;height:22px;border-radius:50%;background:var(--soft);border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ink2)}
.rd-list li.more{padding-left:32px;color:var(--mut)}
.rd-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-top:8px}
.tag{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--ink2)}
.tag.ok{background:var(--okbg);border-color:transparent;color:var(--ok)}

/* ---------- 2 · the course ---------- */
.s-course .heat .h1{width:820px;height:520px;left:calc(50% - 410px);top:44%;background:radial-gradient(closest-side,var(--heat2),rgba(255,170,80,0))}
.path{list-style:none;margin:clamp(24px,4.4svh,48px) 0 0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;position:relative;width:100%;text-align:left}
.path::before,.path::after{content:"";position:absolute;left:12.5%;right:12.5%;top:27px;height:3px;border-radius:2px;background:var(--line)}
.path::after{background:linear-gradient(90deg,var(--red),#FF6A3D 60%,#FFB35C);transform-origin:left center;transition:transform 1.6s cubic-bezier(.3,.7,.2,1)}
.armed .path::after{transform:scaleX(0)}
.ps{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 8px}
.ps-n{position:relative;z-index:1;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:#FFFFFF;border:1.5px solid var(--line2);font-size:20px;font-weight:700;color:var(--ink);box-shadow:0 10px 24px -14px rgba(60,20,10,.4)}
.ps:first-child .ps-n{background:var(--red);border-color:var(--red);color:#FFFFFF}
.ps b{margin-top:16px;font-size:20px;font-weight:650;color:var(--ink);letter-spacing:-.01em}
.ps small{margin-top:4px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--red)}
.ps p{margin:8px 0 0;max-width:24ch;font-size:16px;line-height:1.5;color:var(--ink2)}
.course-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:16px 28px;margin-top:clamp(24px,4.4svh,48px)}
.lg-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.lg-row .k{font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-right:4px}
.lg{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 14px 0 6px;border-radius:13px;background:#FFFFFF;border:1px solid var(--line);font-weight:600;font-size:15px;box-shadow:0 8px 20px -16px rgba(40,15,8,.4)}
.lg span{width:32px;height:32px;border-radius:9px;background:var(--soft);display:grid;place-items:center}
.lg img{width:19px;height:19px}

/* ---------- 3 · free AI audit ---------- */
.s-audit .heat .h1{width:720px;height:620px;right:-160px;top:10%;background:radial-gradient(closest-side,var(--heat1),rgba(255,92,56,0))}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,480px);gap:clamp(32px,5cqi,72px);align-items:center}
.ticks{list-style:none;margin:clamp(18px,3svh,28px) 0 0;padding:0;display:flex;flex-direction:column;gap:12px}
.ticks li{display:flex;gap:12px;font-size:17px;line-height:1.5;color:var(--ink2)}
.ticks li svg{flex:none;margin-top:3px;color:var(--ok)}
.ticks b{color:var(--ink)}
.split .cta-row{margin-top:clamp(20px,3.4svh,32px)}
.report{position:relative;border-radius:26px;background:#FFFFFF;border:1px solid var(--line);box-shadow:0 2px 6px rgba(20,12,8,.04),0 40px 80px -34px rgba(120,30,10,.32);padding:24px}
.rp-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.rp-k{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--red)}
.rp-k i{width:8px;height:8px;border-radius:50%;background:var(--red)}
.rp-ex{font-size:12.5px;font-weight:600;color:var(--mut);padding:4px 10px;border-radius:999px;background:var(--soft);border:1px solid var(--line)}
.rp-biz{display:flex;align-items:center;gap:12px;margin-top:16px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.rp-biz .bc-map{width:44px;height:44px;border-radius:10px}
.rp-biz b{display:block;font-size:17px;color:var(--ink)}
.rp-biz span{font-size:14px;color:var(--mut)}
.rp-big{display:flex;align-items:baseline;gap:12px;margin-top:16px}
.rp-num{font-size:52px;line-height:1;font-weight:650;letter-spacing:-.04em;color:var(--ink);font-variant-numeric:tabular-nums}
.rp-num small{font-size:24px;letter-spacing:0;margin-left:2px}
.rp-lbl{font-size:15px;line-height:1.35;color:var(--ink2);max-width:16ch}
.rp-bars{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:11px}
.rp-bars li{display:grid;grid-template-columns:minmax(0,1fr) 54px;gap:4px 12px;align-items:center;font-size:15px;color:var(--ink2)}
.rp-bars li b{text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.rp-bars li .bar{grid-column:1 / -1;height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.rp-bars li .bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--red),#FF7A45);transform-origin:left center;transition:transform 1.2s cubic-bezier(.3,.7,.2,1)}
.armed .rp-bars li .bar i{transform:scaleX(0)}
.rp-bars li:nth-child(2) .bar i{transition-delay:.12s}.rp-bars li:nth-child(3) .bar i{transition-delay:.24s}.rp-bars li:nth-child(4) .bar i{transition-delay:.36s}
.rp-first{display:flex;align-items:center;gap:10px;margin-top:18px;padding:12px 14px;border-radius:14px;background:#FFF6F4;border:1px solid #F6D9D4;font-size:15px;color:var(--ink2)}
.rp-first b{color:var(--ink)}
.rp-first svg{flex:none;color:var(--red)}

/* ---------- 4 · services ---------- */
.s-serv .heat .h1{width:760px;height:560px;left:-200px;top:30%;background:radial-gradient(closest-side,var(--heat2),rgba(255,170,80,0))}
.serv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:clamp(24px,4.4svh,48px);width:100%;text-align:left}
.sv{display:flex;flex-direction:column;gap:10px;padding:22px;border-radius:22px;background:#FFFFFF;border:1px solid var(--line);box-shadow:0 18px 40px -30px rgba(40,15,8,.4);transition:transform .2s,box-shadow .2s,border-color .2s}
.sv:hover{transform:translateY(-3px);border-color:var(--line2);box-shadow:0 26px 50px -30px rgba(120,30,10,.45)}
.sv-ic{width:52px;height:52px;border-radius:15px;background:#FFF1EE;display:grid;place-items:center;color:var(--red)}
.sv b{margin-top:6px;font-size:20px;font-weight:650;letter-spacing:-.01em;color:var(--ink)}
.sv p{margin:0;font-size:16px;line-height:1.5;color:var(--ink2)}
.sv ul{list-style:none;margin:auto 0 0;padding:12px 0 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px;font-size:14.5px;color:var(--mut)}
.sv li{display:flex;gap:8px;align-items:center}
.sv li::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--red);flex:none}
.s-serv .cta-row{justify-content:center;margin-top:clamp(22px,4svh,40px)}
.s-audit,.s-serv{padding-bottom:calc(clamp(28px,6svh,72px) + 56px)}

/* ---------- 5 · why free and footer ---------- */
.s-why{justify-content:space-between}
.s-why .heat .h1{width:820px;height:600px;left:calc(50% - 200px);top:-10%;background:radial-gradient(closest-side,var(--heat1),rgba(255,92,56,0))}
.why{flex:1;display:flex;align-items:center}
.why-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,520px);gap:clamp(32px,5cqi,72px);align-items:center;width:100%}
.why-p{margin:16px 0 0;max-width:34em;font-size:clamp(17px,2.3svh,19px);line-height:1.6;color:var(--ink2)}
.why .cta-row{margin-top:clamp(20px,3.4svh,30px)}
.ways{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.way{display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px 16px;align-items:center;padding:18px 20px;border-radius:20px;background:#FFFFFF;border:1px solid var(--line);box-shadow:0 14px 32px -26px rgba(40,15,8,.4)}
.way span{grid-row:1 / 3;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--soft);border:1px solid var(--line);font-weight:700;color:var(--ink)}
.way:first-child span{background:var(--red);border-color:var(--red);color:#FFFFFF}
.way b{font-size:18px;font-weight:650;color:var(--ink)}
.way p{margin:0;font-size:15.5px;line-height:1.45;color:var(--mut)}
.foot{position:relative;z-index:1;margin-top:clamp(24px,4svh,48px);border-top:1px solid var(--line);background:rgba(255,255,255,.7)}
.foot-in{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr);gap:24px 40px;padding-block:28px 20px}
.foot-brand img{width:118px;display:block}
.foot-brand p{margin:12px 0 0;max-width:30ch;font-size:15px;line-height:1.5;color:var(--ink2)}
.foot h4{margin:0 0 10px;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.foot ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:15.5px}
.foot a{color:var(--ink2);text-decoration:none}
.foot a:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.foot-base{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 20px;padding-block:14px 22px;border-top:1px solid var(--line);font-size:14px;color:var(--mut)}
.foot-base nav{display:flex;gap:18px}

/* ---------- sticky course bar (outside the app, so it follows the screen) ---------- */
.sticky{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:90;display:flex;align-items:center;gap:16px;padding:8px 8px 8px 18px;border-radius:20px;background:rgba(23,17,15,.94);color:#FFFFFF;box-shadow:0 20px 50px -14px rgba(0,0,0,.45);font-family:var(--ui);transform:translate(-50%,140%);transition:transform .35s cubic-bezier(.2,.75,.25,1);max-width:calc(100vw - 24px)}
.sticky.show{transform:translate(-50%,0)}
.sticky .tx{display:flex;align-items:center;gap:12px;font-size:15px;font-weight:600;white-space:nowrap}
.sticky .trio span{border-color:rgba(255,255,255,.2)}
.sticky .btn-create{height:48px;padding:0 20px;font-size:16px;border-radius:14px;box-shadow:none}

@media (max-width:640px){.sticky{left:12px;right:12px;transform:translateY(140%);padding:8px}.sticky.show{transform:none}.sticky .tx{display:none}.sticky .btn-create{flex:1}}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:101;max-width:calc(100vw - 32px);padding:12px 18px;border-radius:12px;background:#17110F;color:#FFFFFF;font-weight:600;font-size:15px;box-shadow:0 12px 30px rgba(0,0,0,.3);text-align:center;font-family:var(--ui)}

/* ---------- module 1 ---------- */
.md{min-height:calc(100svh - var(--topbar))}

.md-top-in{display:flex;align-items:center;gap:20px;height:72px}
.md-top .brand img{width:112px}
.md-course{display:flex;flex-direction:column;min-width:0;padding-left:20px;border-left:1px solid var(--line)}
.md-course span{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.md-course b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.md-prog{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:14px;color:var(--ink2);white-space:nowrap;font-variant-numeric:tabular-nums}
.md-bar{width:120px;height:8px;border-radius:4px;background:var(--soft);overflow:hidden;border:1px solid var(--line)}
.md-bar i{display:block;height:100%;background:var(--red);transition:width .6s}
.md-save{flex:none;display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line2);background:#FFFFFF;font-weight:600;font-size:14.5px;text-decoration:none;color:var(--ink)}

.md-toc{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.md-toc li{display:flex;align-items:flex-start;gap:12px;padding:10px 12px;border-radius:12px;font-size:15.5px;line-height:1.35;color:var(--ink2);border:1px solid transparent}
.md-toc li.cur{background:#FFFFFF;border-color:var(--line);box-shadow:0 8px 18px -12px rgba(0,0,0,.25);color:var(--ink);font-weight:600}

.md-toc .lk{margin-left:auto;flex:none;margin-top:3px}

.md-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.md-h1{margin:18px 0 0;font-size:clamp(34px,3.6cqi,50px);line-height:1.06;letter-spacing:-.03em;font-weight:650;text-wrap:balance;color:var(--ink)}
.md-lead{margin:16px 0 0;font-size:20px;line-height:1.55;color:var(--ink2);max-width:60ch}
.ai-note{margin:14px 0 0;font-size:14.5px;color:var(--mut)}
.md-sec{margin-top:44px}
.md-sec h2{display:flex;align-items:center;gap:12px;margin:0 0 14px;font-size:25px;line-height:1.2;letter-spacing:-.015em;font-weight:650;text-wrap:balance;color:var(--ink)}
.md-sn{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:15px;font-weight:700;background:var(--ink);color:#FFFFFF}
.md-sec p{margin:0 0 14px;font-size:18px;line-height:1.65;color:var(--ink2);max-width:65ch}
.bots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.bot{display:flex;flex-direction:column;gap:6px;padding:18px;border-radius:18px;border:1px solid var(--line);background:#FFFFFF;text-decoration:none;color:var(--ink);transition:transform .15s,box-shadow .15s}

.bot-l img{width:26px;height:26px}
.bot b{font-size:18px}
.bot small{font-size:13.5px;color:var(--mut);font-weight:600}
.bot p{margin:4px 0 0;font-size:15px;line-height:1.5;color:var(--ink2)}
.md-note{font-size:15px;color:var(--mut);margin:12px 0 0}

<style>
/* =========================================================================================
   WIN WORK: the workflow card in the hero, the three jobs it handles
   ========================================================================================= */
.ww-split{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:clamp(28px,4.6cqi,64px);align-items:center;text-align:left}
.ww-copy{display:flex;flex-direction:column;align-items:flex-start}
.ww-copy .hero-h{max-width:12ch}
.ww-copy .ticks li{text-align:left}
.ww-copy .cta-row{margin-top:clamp(18px,3svh,28px)}
.wf{position:relative;padding:22px;border-radius:30px;background:rgba(255,255,255,.95);border:1px solid var(--line);box-shadow:0 2px 6px rgba(20,12,8,.03),0 50px 100px -56px rgba(120,30,10,.6)}
.wf-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.wf-top .ex{letter-spacing:0;text-transform:none;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--soft);border:1px solid var(--line)}

.wf ol::before{content:"";position:absolute;left:23px;top:24px;bottom:24px;width:2px;background:var(--line)}
.wf li{position:relative;display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:14px;align-items:center;padding:clamp(6px,1.2svh,12px) 14px clamp(6px,1.2svh,12px) 0;border-radius:18px}
.wf li > i{position:relative;z-index:1;display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:#FFFFFF;border:1.5px solid var(--line2);color:var(--ink2)}
.mo .wf li > i{animation:wlit 7s infinite}
.wf li:nth-child(2) > i{animation-delay:1.4s}.wf li:nth-child(3) > i{animation-delay:2.8s}.wf li:nth-child(4) > i{animation-delay:4.2s}.wf li:nth-child(5) > i{animation-delay:5.6s}
@keyframes wlit{0%,20%,100%{background:#FFFFFF;border-color:var(--line2);color:var(--ink2);box-shadow:none}3%,17%{background:var(--go);border-color:var(--go);color:#FFFFFF;box-shadow:0 0 0 6px rgba(30,123,69,.14)}}
.wf li b{display:block;font-size:17px;letter-spacing:-.01em}
.wf li small{display:block;margin-top:2px;font-size:14px;color:var(--mut);line-height:1.4}
.wf .who{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:999px}

.wf .who.you{background:var(--okbg);color:var(--ok)}
.wf .src{display:flex;gap:6px;margin-top:6px}
.wf .src span{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--soft);border:1px solid var(--line);color:var(--ink2)}
.areas.a3{grid-template-columns:repeat(3,minmax(0,1fr));max-width:1080px}
.rowc .pr{margin-left:auto;padding:2px 8px;border-radius:7px;background:var(--chip);color:var(--red);font-weight:700;font-size:11.5px;white-space:nowrap}
@media (max-height:780px){.wf li small{display:none}.wf .src{display:none}.wf li > i{width:42px;height:42px}.wf ol::before{left:20px}.wf li{grid-template-columns:42px minmax(0,1fr) auto}}
/* what we automate: four little screens, each playing its job */
.s-auto .sec-sub{max-width:40em}
.areas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;width:100%;margin-top:clamp(18px,3.4svh,34px);text-align:left}
.ar{display:flex;flex-direction:column;border-radius:26px;background:#FFFFFF;border:1px solid var(--line);box-shadow:0 2px 6px rgba(20,12,8,.03),0 30px 60px -46px rgba(120,30,10,.5);overflow:hidden;min-width:0}
.ar-h{padding:18px 18px 0}
.ar-ic{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--chip);color:var(--red)}
.ar-ic svg{width:21px;height:21px}
.ar-h b{display:block;margin-top:12px;font-size:19px;letter-spacing:-.01em}
.ar-h p{margin:4px 0 0;font-size:14.5px;line-height:1.45;color:var(--ink2)}
.vgw{position:relative;margin:14px;height:clamp(170px,24svh,214px);border-radius:18px;background:var(--soft);border:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:7px;overflow:hidden}
.vgw .bar{display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.vgw .ex{letter-spacing:0;text-transform:none;font-weight:600;padding:2px 8px;border-radius:999px;background:#FFFFFF;border:1px solid var(--line)}
.aq{opacity:0;transform:translateY(8px);animation:aq 8s cubic-bezier(.2,.75,.25,1) infinite}
.aq.s1{animation-delay:.2s}.aq.s2{animation-delay:1.4s}.aq.s3{animation-delay:2.8s}.aq.s4{animation-delay:4s}
@keyframes aq{0%{opacity:0;transform:translateY(8px)}6%,82%{opacity:1;transform:none}92%,100%{opacity:0;transform:translateY(-4px)}}
.mo .s-auto:not(.on) .aq{animation-play-state:paused}
.vgw .bub{max-width:88%;padding:8px 11px;border-radius:14px;font-size:13px;line-height:1.35}
.vgw .bub.in{background:#FFFFFF;border:1px solid var(--line);border-bottom-left-radius:4px}
.vgw .bub.out{align-self:flex-end;background:var(--ink);color:#FFFFFF;border-bottom-right-radius:4px}
.ap{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:4px 10px;border-radius:999px;font-size:12.5px;font-weight:650;line-height:1.2}
.ap.ok{background:var(--okbg);color:var(--ok)}
.ap.ai{background:#FFFFFF;border:1px solid var(--line);color:var(--ink2)}
.ap.ai i{flex:none;width:8px;height:8px;border-radius:50%;background:#FF6A3D;animation:apu 1.6s ease-out infinite}

.rowc{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:12px;background:#FFFFFF;border:1px solid var(--line);font-size:13px}
.rowc b{font-size:13px}
.rowc small{display:block;color:var(--mut);font-size:11.5px}
.rowc .stars{color:#E6A817;letter-spacing:1px;font-size:13px}
.rowc .paid{margin-left:auto;padding:3px 8px;border-radius:7px;border:2px solid var(--go);color:var(--go);font-weight:800;font-size:11px;letter-spacing:.08em;transform:rotate(-6deg)}
.rowc .late{margin-left:auto;color:var(--red);font-weight:650;font-size:12px;white-space:nowrap}
.ar-go{display:inline-flex;align-items:center;gap:6px;margin:-4px 18px 16px;font-size:14px;font-weight:650;color:var(--red);text-decoration:none}
.ar-go svg{width:16px;height:16px}
.ar-dots{display:none}
.ar-cta{justify-content:center;margin-top:clamp(18px,3.4svh,32px)}
@media (max-height:780px){.s-auto .sec-sub{display:none}.vgw{height:176px;gap:5px}.vgw .bub{padding:6px 9px;font-size:12.5px}}
@media (prefers-reduced-motion:reduce){.aq{animation:none;opacity:1;transform:none}.ap.ai i{animation:none}.h2p .flow .pl{display:none}}


@container app (max-width:860px){
  .ww-split{grid-template-columns:minmax(0,1fr);gap:14px}
  .ww-copy .hero-h{max-width:none}
  .ww-copy .ticks,.ww-copy .note{display:none}
  .ww-copy .cta-row{margin-top:14px}
  .wf{padding:14px;border-radius:22px}

  .wf ol::before{left:19px}
  .wf li small,.wf .src{display:none}.wf li b{font-size:15px}

  .ar{flex:0 0 82%;scroll-snap-align:center}
  .vgw{height:200px;margin:12px}

}
@container app (max-width:860px){@media (max-height:760px){.ww-copy .lede{font-size:15.5px}.wf li{padding:3px 8px 3px 0}.wf li > i{width:34px;height:34px}.wf ol::before{left:16px}.s-auto .sec-sub,.ar-h p{display:none}.vgw{height:168px}}}

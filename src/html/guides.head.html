<style>
.hero-h em{font-family:var(--disp);font-style:italic;font-weight:400;font-size:1.12em;letter-spacing:-.015em;color:var(--red)}
.center .sec-sub{text-wrap:balance}

/* ---------- 1 · the search ---------- */
.gh .heat .h1{left:calc(50% - 720px);top:30%}
.gh .heat .h2{left:calc(50% - 20px);top:20%}
.gh .heat .h3{top:60%}
.gh-main .hero-h{max-width:15ch}
.gh-main .lede{max-width:34em;text-wrap:balance}
.srch{position:relative;z-index:6;width:100%;max-width:760px;margin-top:clamp(20px,3.8svh,38px);text-align:left}
.srch-f{display:flex;align-items:center;gap:14px;height:72px;padding:0 8px 0 26px;border-radius:999px;background:#FFFFFF;border:1.5px solid var(--line2);box-shadow:0 2px 6px rgba(20,12,8,.04),0 34px 70px -34px rgba(120,30,10,.42);transition:border-color .15s,box-shadow .15s}
.srch-f:focus-within{border-color:var(--ink);box-shadow:0 0 0 4px var(--ring),0 34px 70px -34px rgba(120,30,10,.42)}
.srch-f > svg{flex:none;color:var(--ink)}
.srch-f input{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;font-size:19px;color:var(--ink);-webkit-appearance:none;appearance:none}
.srch-f input::placeholder{color:var(--ph)}
.srch-f input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.app .srch-f input:focus-visible{outline:0}
.srch-go{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:56px;padding:0 26px;border-radius:999px;border:0;background:var(--red);color:#FFFFFF;font-weight:650;font-size:17px;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 1px 2px rgba(150,10,8,.3),0 12px 26px -10px rgba(196,15,11,.5);transition:background .15s,transform .15s}
.srch-go:hover{background:var(--red-h);transform:translateY(-1px)}
.srch.nudge .srch-f{animation:nudge .4s}

/* live results, in the same style as the home page business finder */
.gs-pop{position:absolute;left:0;right:0;top:calc(100% + 10px);z-index:40;background:#FFFFFF;border:1px solid var(--line);border-radius:24px;box-shadow:0 2px 6px rgba(20,12,8,.06),0 28px 64px -16px rgba(20,12,8,.28);overflow:hidden;animation:popin .16s ease-out}
.gs-pop[hidden]{display:none}
.gs-list{list-style:none;margin:0;padding:4px 8px 8px}
.gs-o{display:grid;grid-template-columns:44px minmax(0,1fr) 32px;gap:14px;align-items:center;padding:10px;border-radius:16px;cursor:pointer}
.gs-o[aria-selected="true"],.gs-o:hover{background:var(--soft)}
.gs-ic{width:44px;height:44px;border-radius:13px;background:#FFF1EE;color:var(--red);display:grid;place-items:center}
.gs-m{display:flex;flex-direction:column;min-width:0}
.gs-m b{font-size:17px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gs-m b mark{background:transparent;color:var(--red);font-weight:700}
.gs-m span{font-size:14.5px;color:var(--mut)}
.gs-go{color:var(--mut);display:grid;place-items:center}
.gs-o[aria-selected="true"] .gs-go{color:var(--ink)}
.gs-pop .none{padding:14px 14px 10px}

/* popular topics */
.topics{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px;max-width:1060px;margin-top:clamp(16px,2.8svh,26px)}
.topics .k{font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-right:4px}
.tp{display:inline-flex;align-items:center;gap:9px;height:46px;padding:0 18px 0 8px;border-radius:999px;border:1.5px solid var(--line2);background:rgba(255,255,255,.9);font-size:15.5px;font-weight:600;color:var(--ink);white-space:nowrap;transition:background .22s,border-color .22s,color .22s,box-shadow .22s,transform .15s}
.tp:hover{border-color:var(--ink2);transform:translateY(-1px);box-shadow:0 10px 20px -14px rgba(40,15,8,.5)}
.tp:active{transform:scale(.97)}
.tp-ic{flex:none;width:30px;height:30px;border-radius:50%;background:#FFF1EE;color:var(--red);display:grid;place-items:center;transition:background .22s,color .22s}
.tp[aria-pressed="true"]{background:var(--go);border-color:var(--go);color:#FFFFFF;box-shadow:0 8px 18px -12px rgba(20,110,60,.5)}
.tp[aria-pressed="true"] .tp-ic{background:rgba(255,255,255,.2);color:#FFFFFF}
.app .tp:focus-visible{outline-color:var(--ink)}

/* two quiet example cards either side of the search on wide screens */
.fl{position:absolute;z-index:1;display:none;width:236px;text-align:left;pointer-events:none}
.fl-l{left:max(30px,calc(50% - 664px));top:30%;transform:rotate(-4deg);padding:14px 16px 16px;border-radius:20px;background:#17110F;color:#F7F2EE;box-shadow:0 30px 60px -30px rgba(0,0,0,.55)}
.fl-h{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#FFB59E}
.fl-copy{height:26px;padding:0 11px;border-radius:999px;background:rgba(255,255,255,.1);display:inline-flex;align-items:center;font-size:12px;letter-spacing:0;text-transform:none;color:#FFFFFF}
.fl-l p{margin:10px 0 0;font-size:14px;line-height:1.5;color:#EDE4DE}
.fl-l p b{color:#FFFFFF;font-weight:600}
.fl-r{right:max(30px,calc(50% - 664px));top:45%;transform:rotate(3.5deg);padding:16px 16px 14px;border-radius:20px;background:#FFFFFF;border:1px solid var(--line);box-shadow:0 2px 6px rgba(20,12,8,.04),0 30px 60px -30px rgba(120,30,10,.4)}
.fl-k{display:block;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--red)}
.fl-r ul{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.fl-r li{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink2)}
.fl-r li i{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center}
.fl-r li.ok i{background:var(--go);border-color:var(--go);color:#FFFFFF}
.fl-r li.ok{color:var(--ink)}
.fl-t{display:flex;align-items:center;gap:6px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--mut)}
@container app (min-width:1300px){ .fl{display:block} }
@container app (max-width:1439px){ .fl{width:212px} .fl-l p,.fl-r li{font-size:13px} }

/* ---------- 2 · featured guides ---------- */
.s-feat .heat .h1{width:960px;height:560px;left:calc(50% - 480px);top:40%;background:radial-gradient(closest-side,var(--heat2),rgba(255,170,80,0))}
.s-feat .heat .h2{width:620px;height:520px;left:-220px;top:-10%;background:radial-gradient(closest-side,var(--heat3),rgba(255,110,140,0))}
.gcards{list-style:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;width:100%;margin:clamp(22px,4svh,44px) 0 0;padding:0;text-align:left}
.gcards li{display:flex;min-width:0}
.gc{position:relative;flex:1;display:flex;flex-direction:column;min-width:0;border-radius:24px;background:#FFFFFF;border:1px solid var(--line);box-shadow:0 2px 6px rgba(20,12,8,.03),0 30px 60px -42px rgba(120,30,10,.45);overflow:hidden;text-decoration:none;color:inherit;transition:transform .2s,box-shadow .2s,border-color .2s}
.gc:hover{transform:translateY(-3px);border-color:var(--line2);box-shadow:0 2px 6px rgba(20,12,8,.04),0 40px 70px -40px rgba(120,30,10,.55)}
.gc-art{position:relative;display:grid;place-items:center;height:clamp(110px,15svh,144px);background:radial-gradient(120% 130% at 50% 0%,#FFF3EE 0%,#FBF7F4 55%,#F7F2EE 100%);border-bottom:1px solid var(--line);overflow:hidden}
.gc-ic{display:none}
.gc-b{display:flex;flex-direction:column;gap:9px;padding:clamp(14px,2svh,18px) 20px clamp(16px,2.3svh,20px)}
.gc-meta{display:flex;align-items:center;gap:10px}
.gc-t{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:500;color:var(--mut);white-space:nowrap}
.gc h3{margin:0;padding-right:36px;font-size:18.5px;line-height:1.28;font-weight:650;letter-spacing:-.012em;color:var(--ink);text-wrap:balance}
.gc-go{position:absolute;right:16px;bottom:16px;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;color:var(--ink);background:#FFFFFF;transition:background .2s,border-color .2s,color .2s}
.gc:hover .gc-go{background:var(--red);border-color:var(--red);color:#FFFFFF}

/* the small drawn headers: each one is a tiny picture of the job */
.mu{background:#FFFFFF;border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 28px -18px rgba(60,20,10,.45);font-size:12.5px;line-height:1.35;color:var(--ink2)}
.a-wrap{position:relative}
.a-doc{width:196px;padding:11px 13px 12px;transform:rotate(-2deg)}
.a-dh{display:flex;align-items:center;gap:9px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.a-logo{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(145deg,#8E2A17,#3B130C);color:#FFE9DF;font-family:var(--disp);font-size:13px;letter-spacing:-.04em}
.a-dh b{display:block;font-size:12.5px;color:var(--ink)}
.a-dh small{display:block;font-size:11px;color:var(--mut)}
.a-ln{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:7px}
.a-ln i{height:6px;border-radius:3px;background:#ECE4DE}
.a-pr{flex:none;height:18px;padding:0 6px;border-radius:6px;border:1px dashed #E3A79C;background:#FFF6F4;font-size:10.5px;font-weight:700;color:var(--chip-ink);display:inline-flex;align-items:center}
.a-badge{position:absolute;right:-19px;top:8px;width:38px;height:38px;border-radius:50%;background:#FFFFFF;border:1px solid var(--line);display:grid;place-items:center;box-shadow:0 10px 20px -10px rgba(0,0,0,.35)}
.a-badge img{width:21px;height:21px}
.a-chat{display:flex;flex-direction:column;gap:6px;width:262px}
.a-b{max-width:94%;white-space:nowrap;padding:7px 11px;border-radius:14px;font-size:12.5px;line-height:1.35}
.a-in{align-self:flex-start;background:#FFFFFF;border:1px solid var(--line);color:var(--ink2);border-bottom-left-radius:5px;box-shadow:0 10px 20px -16px rgba(60,20,10,.45)}
.a-out{align-self:flex-end;background:#17110F;color:#F7F2EE;border-bottom-right-radius:5px;box-shadow:0 12px 22px -14px rgba(0,0,0,.5)}
.a-sm{align-self:flex-end;display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--mut)}
.a-sm svg{color:var(--go)}
.a-rev{width:206px;padding:12px 14px;text-align:center}
.a-rev b{display:block;font-size:12.5px;color:var(--ink)}
.a-stars{display:flex;justify-content:center;gap:3px;margin-top:6px;color:#E2A100}
.a-rev .a-cta{display:inline-flex;align-items:center;margin-top:8px;height:24px;padding:0 12px;border-radius:999px;background:var(--red);color:#FFFFFF;font-size:11px;font-weight:650}
.a-cal{width:196px;padding:10px 12px 12px}
.a-calh{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;font-weight:600;color:var(--mut)}
.a-calh b{font-size:12.5px;color:var(--ink)}
.a-calg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.a-calg i{height:13px;border-radius:4px;background:#F2ECE7}
.a-calg i.p{background:linear-gradient(135deg,#FF8A5C,#C40F0B)}
.a-calg i.q{background:linear-gradient(135deg,#FFD08A,#FF8A4C)}
.a-calg i.r{background:linear-gradient(135deg,#FFC3CF,#F27B94)}
.a-inv{width:196px;padding:11px 13px 12px;transform:rotate(1.5deg)}
.a-invh{display:flex;justify-content:space-between;align-items:center;gap:6px}
.a-invh b{font-size:12.5px;color:var(--ink)}
.a-due{height:20px;padding:0 8px;border-radius:999px;background:#FFF3E0;color:#8A5200;font-size:10.5px;font-weight:700;display:inline-flex;align-items:center}
.a-note{display:flex;align-items:center;gap:6px;margin-top:9px;padding:6px 8px;border-radius:9px;background:var(--soft);font-size:11px;color:var(--ink2)}
.a-note svg{flex:none;color:var(--red)}
.a-paid{position:absolute;right:-22px;bottom:-12px;display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 11px 0 8px;border-radius:999px;background:var(--go);color:#FFFFFF;font-size:11.5px;font-weight:700;box-shadow:0 10px 20px -10px rgba(20,110,60,.6);transform:rotate(-4deg)}
.a-safe{display:flex;align-items:center;gap:12px}
.a-shield{flex:none;width:52px;height:52px;border-radius:16px;background:linear-gradient(145deg,#E0261C,#9E0B08);color:#FFFFFF;display:grid;place-items:center;box-shadow:0 14px 26px -12px rgba(196,15,11,.6)}
.a-inp{width:176px;padding:9px 11px;border-radius:14px}
.a-inp small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.a-inp p{margin:4px 0 0;font-size:12.5px;line-height:1.45;color:var(--ink)}
.a-ph{display:inline-block;padding:0 5px;border-radius:5px;background:#FFF1EE;color:var(--chip-ink);font-weight:600}

/* ---------- 3 · by trade ---------- */
.s-trade .heat .h1{width:780px;height:640px;right:-200px;top:6%;background:radial-gradient(closest-side,var(--heat1),rgba(255,92,56,0))}
.s-trade .heat .h2{width:620px;height:480px;left:-180px;top:58%;background:radial-gradient(closest-side,var(--heat2),rgba(255,170,80,0))}
.tr-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,720px);gap:clamp(32px,5cqi,72px);align-items:center}
.s-trade .sec-sub,.tr-alt{text-wrap:pretty}
.tr-alt{margin:clamp(18px,3svh,28px) 0 0;font-size:16px;line-height:1.5;color:var(--ink2)}
.tr-alt a{color:var(--ink);font-weight:600;text-underline-offset:4px}
.trades{list-style:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:1fr;gap:14px;margin:0;padding:0}
.trades li{display:flex;min-width:0}
.trd{position:relative;flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:0;padding:20px 20px 22px;border-radius:24px;background:#FFFFFF;border:1px solid var(--line);box-shadow:0 2px 6px rgba(20,12,8,.03),0 30px 60px -44px rgba(120,30,10,.45);text-decoration:none;color:inherit;overflow:hidden;transition:transform .2s,box-shadow .2s,border-color .2s}
.trd:hover{transform:translateY(-3px);border-color:var(--line2);box-shadow:0 2px 6px rgba(20,12,8,.04),0 40px 70px -40px rgba(120,30,10,.55)}
.trd-ic{width:50px;height:50px;border-radius:15px;background:#FFF1EE;color:var(--red);display:grid;place-items:center;margin-bottom:clamp(10px,2svh,22px)}
.trd b{font-size:18px;line-height:1.25;font-weight:650;letter-spacing:-.01em;color:var(--ink)}
.trd small{font-size:14.5px;line-height:1.45;color:var(--mut)}
.trd-go{position:absolute;right:16px;top:20px;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;color:var(--ink);transition:background .2s,border-color .2s,color .2s}
.trd:hover .trd-go{background:var(--red);border-color:var(--red);color:#FFFFFF}

/* ---------- 4 · the weekly tip ---------- */
.tip-grid{grid-template-columns:minmax(0,1fr) minmax(0,540px)}
.s-tip .ticks{margin-top:clamp(16px,2.8svh,26px)}
.s-tip .card{margin-top:0;max-width:none}
.tip-in{padding:clamp(18px,2.8svh,26px) 28px clamp(18px,2.8svh,26px)}
.tip-mail{padding:14px 16px;border-radius:20px;background:var(--soft);border:1px solid var(--line)}
.tm-top{display:flex;align-items:center;gap:12px}
.tm-av{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,#E0261C,#9E0B08);color:#FFFFFF;font-family:var(--disp);font-style:italic;font-size:22px;line-height:1;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 8px 16px -8px rgba(196,15,11,.6)}
.tm-from{flex:1;min-width:0}
.tm-from b{display:block;font-size:15px;color:var(--ink)}
.tm-from span{display:block;font-size:13.5px;color:var(--mut)}
.tm-from .tm-rt{display:inline}
.tm-s{margin:12px 0 0;font-size:17px;font-weight:650;line-height:1.3;letter-spacing:-.01em;color:var(--ink)}
.tm-p{margin:4px 0 0;font-size:15px;line-height:1.5;color:var(--ink2)}
.tip-form{display:flex;flex-direction:column;gap:12px;margin-top:clamp(14px,2.4svh,20px)}
.tip-form[hidden]{display:none}
.tip-row{display:flex;gap:10px}
.tip-form.nudge .tip-row{animation:nudge .4s}
.tip-row .inp{flex:1;min-width:0}
.tip-row .btn-create{flex:none;height:56px;padding:0 24px;font-size:17px}
.tip-fine{margin:12px 0 0;font-size:14px;color:var(--mut);text-align:center}
.tip-fine.err{color:var(--red);font-weight:600}
.tip-row .inp[aria-invalid="true"]{border-color:var(--red);box-shadow:0 0 0 4px rgba(196,15,11,.12)}
.tip-ok{display:flex;align-items:center;gap:14px;margin-top:clamp(14px,2.4svh,20px);padding:16px 18px;border-radius:20px;background:var(--okbg)}
.tip-ok[hidden]{display:none}
.tip-ok i{flex:none;width:40px;height:40px;border-radius:50%;background:var(--go);color:#FFFFFF;display:grid;place-items:center}
.tip-ok b{display:block;font-size:17px;color:var(--ink)}
.tip-ok span{display:block;font-size:15px;color:var(--ink2)}
.s-tip .foot{margin-top:clamp(18px,3svh,40px)}

/* ---------- phone ---------- */
@container app (max-width:860px){
  .gh-main .hero-h{max-width:none}
  .srch{margin-top:20px}
  .srch-f{height:60px;padding:0 6px 0 18px;gap:10px}
  .srch-f input{font-size:17px}
  .srch-go{height:48px;padding:0 18px;font-size:16px}
  .gs-pop{border-radius:20px}
  .gs-o{grid-template-columns:40px minmax(0,1fr) 24px;gap:12px;padding:8px}
  .gs-ic{width:40px;height:40px;border-radius:12px}
  .gs-m b{font-size:15.5px;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .gs-m span{font-size:13.5px}
  .gs-pop .pop-h span:last-child{display:none}
  .topics{gap:8px;margin-top:16px}
  .topics .k{display:none}
  .tp{height:44px;padding:0 14px 0 7px;gap:7px;font-size:14.5px}
  .tp-ic{width:28px;height:28px}

  .gcards{grid-template-columns:minmax(0,1fr);gap:8px;margin-top:18px}
  .gc{display:grid;grid-template-columns:44px minmax(0,1fr) 30px;column-gap:14px;align-items:center;padding:11px 12px 11px 14px;border-radius:18px}
  .gc-art{display:none}
  .gc-ic{display:grid;width:44px;height:44px;border-radius:13px;background:#FFF1EE;color:var(--red);place-items:center}
  .gc-b{padding:0;gap:3px}
  .gc-meta .tag{display:none}
  .gc-meta{order:2}
  .gc-t{font-size:13px}
  .gc h3{padding-right:0;font-size:16px;line-height:1.3}
  .gc-go{position:static;width:30px;height:30px}

  .tr-grid{grid-template-columns:minmax(0,1fr);gap:18px}
  .tr-alt{display:none}
  .trades{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .trd{padding:14px 14px 15px;border-radius:18px;gap:3px}
  .trd-ic{width:40px;height:40px;border-radius:12px;margin-bottom:8px}
  .trd-ic svg{width:21px;height:21px}
  .trd b{font-size:16px}
  .trd small{font-size:13.5px;line-height:1.4}
  .trd-go{right:12px;top:14px;width:30px;height:30px}

  .tip-grid{grid-template-columns:minmax(0,1fr);gap:18px}
  .s-tip .ticks{display:none}
  .tip-in{padding:16px}
  .tip-mail{padding:12px 14px;border-radius:16px}
  .tm-av{width:34px;height:34px;border-radius:10px}
  .tm-from b{font-size:14.5px}
  .tm-s{margin-top:10px;font-size:16px}
  .tm-p{font-size:14.5px}
  .tip-form{margin-top:14px;gap:10px}
  .tip-row{flex-direction:column;gap:10px}
  .tip-row .inp{flex:none}
  .s-tip .why-p,.tm-p,.tm-from .tm-rt,.s-tip .foot-brand p{display:none}
  .tip-row .btn-create{width:100%;height:54px}
  .tip-fine{margin-top:10px;font-size:13.5px}
  .s-tip .foot{margin-top:18px}

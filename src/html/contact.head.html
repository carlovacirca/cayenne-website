<style>
.sec-sub,.lede,.faq .fq-a p{text-wrap:pretty}

/* ---------- 1 · hero: how to reach us, and the message card ---------- */
.ct .heat .h1{left:calc(50% - 900px);top:28%}
.ct .heat .h2{left:calc(50% + 40px);top:6%}
.ct .heat .h3{left:calc(50% + 80px);top:56%}
.hero-main.ct-main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,560px);gap:clamp(32px,5.5cqi,88px);align-items:center;justify-items:stretch;text-align:left}
.ct-copy{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.ct-copy .hero-h{max-width:11ch;margin-top:clamp(14px,2.6svh,26px);font-size:clamp(38px,min(4.9cqi,7.4svh),72px);line-height:1.02}
.ct-copy .lede{max-width:26em;margin-top:clamp(14px,2.4svh,22px)}
.cd{list-style:none;display:flex;flex-direction:column;gap:clamp(10px,1.8svh,14px);width:100%;max-width:470px;margin:clamp(22px,4svh,36px) 0 0;padding:clamp(16px,2.8svh,22px) 0 0;border-top:1px solid var(--line)}
.cd li{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:2px 14px;align-items:center}
.cd-ic{grid-row:1 / 3;width:44px;height:44px;border-radius:14px;background:#FFF1EE;color:var(--red);display:grid;place-items:center}
.cd b{font-size:16.5px;font-weight:650;color:var(--ink)}
.cd small{grid-column:2;font-size:14.5px;color:var(--mut)}
.cd .btn-ghost{grid-column:3;grid-row:1 / 3;height:48px;padding:0 18px 0 16px;font-size:15.5px}
.cd .btn-ghost svg{color:var(--red)}

.ct-card{margin-top:0;max-width:none;justify-self:end}
.ct-card .card-in{padding:clamp(20px,3.2svh,28px) 30px clamp(20px,3svh,26px)}
.cf-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.cf-head h2{margin:0;font-size:21px;font-weight:650;letter-spacing:-.015em;color:var(--ink)}
.cf-who{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--mut);white-space:nowrap}
.cf-who i{position:relative;width:8px;height:8px;border-radius:50%;background:var(--red)}
.cf-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(10px,1.8svh,14px) 12px;margin-top:clamp(14px,2.4svh,20px)}
.cf-grid .span{grid-column:1 / -1}
.cf .fld{min-width:0}
.cf .fld > label{font-size:14px}
.cf .inp{height:clamp(50px,6.4svh,56px);font-size:16.5px;padding:0 20px}
.cf textarea.inp{height:clamp(84px,13svh,128px);min-height:0;padding:14px 20px;resize:none;font:inherit;font-size:16.5px;line-height:1.5}
.cf .btn-create{width:100%;margin-top:clamp(14px,2.4svh,20px);height:clamp(52px,6.6svh,58px)}
.cf-fine{display:flex;align-items:center;justify-content:center;gap:8px;margin:clamp(10px,1.8svh,14px) 0 0;font-size:14px;color:var(--mut)}
.cf-fine svg{flex:none}
.cf-fine a{color:var(--ink2);font-weight:600;text-underline-offset:3px}
.ct-reach{display:none;justify-content:space-between;align-items:center;gap:12px;margin:0;font-size:14.5px;color:var(--ink2)}
.ct-reach span,.ct-reach a{display:inline-flex;align-items:center;gap:8px;min-height:44px}
.ct-reach svg{flex:none;color:var(--red)}
.ct-reach a{padding:0 16px 0 14px;border-radius:999px;border:1.5px solid var(--line2);background:#FFFFFF;font-weight:600;color:var(--ink);text-decoration:none}

/* ---------- 2 · quick answers and the footer ---------- */
.ct-q .heat .h1{width:820px;height:600px;left:calc(50% - 160px);top:-14%;background:radial-gradient(closest-side,var(--heat1),rgba(255,92,56,0))}
.ct-q .why-grid{grid-template-columns:minmax(0,1fr) minmax(0,640px);grid-template-areas:"head faq" "cta faq";row-gap:0}
.q-head{grid-area:head;align-self:end}
.q-cta{grid-area:cta;align-self:start;margin-top:clamp(20px,3.6svh,32px)}
.ct-q .faq{grid-area:faq;margin-top:0;max-width:none}
.ct-q .sec-sub{max-width:24em}

@media (max-height:820px){
  @container app (min-width:861px){
    .cd small{font-size:14px}
    .cf-fine{display:none}
    .ct-q .q5{display:none}
  }
}
@media (max-height:700px){
  @container app (min-width:861px){
    .ct-copy .lede{display:none}
  }
}

/* ---------- phone: labels sit inside the fields, so the whole card fits one screen ---------- */
@container app (max-width:860px){
  .ct .heat .h1{left:-380px;top:40%}.ct .heat .h2{left:-60px;top:20%}.ct .heat .h3{left:-160px;top:64%}
  .hero-main.ct-main{grid-template-columns:minmax(0,1fr);gap:clamp(14px,2.4svh,22px);align-content:center;padding-block:4px clamp(12px,2svh,20px)}
  .ct-copy .sec-k{display:none}
  .ct-copy .hero-h{max-width:none;margin-top:0;font-size:clamp(30px,4.3svh,37px)}
  .ct-copy .lede{margin-top:clamp(8px,1.4svh,12px);font-size:16px;line-height:1.5}
  .cd{display:none}
  .ct-card{justify-self:stretch}
  .ct-card .card-in{padding:16px 14px 14px}
  .cf-head h2{font-size:17.5px}
  .cf-who{font-size:12.5px}
  .cf-grid{grid-template-columns:minmax(0,1fr);gap:8px;margin-top:12px}
  .cf .fld{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:0 10px;height:52px;padding-left:18px;border:1.5px solid var(--line2);border-radius:999px;background:#FFFFFF;transition:border-color .15s,box-shadow .15s}
  .cf .fld:focus-within{border-color:var(--ink);box-shadow:0 0 0 4px var(--ring)}
  .cf .fld > label{width:92px;font-size:13.5px;font-weight:650;color:var(--ink2);white-space:nowrap}
  .cf .inp,.app .cf .inp:focus,.app .cf .inp:focus-visible{height:100%;padding:0 18px 0 0;border:0;border-radius:0 999px 999px 0;box-shadow:none;background:transparent;font-size:16px}
  .cf .fld.msg{grid-template-columns:minmax(0,1fr);height:auto;padding:12px 18px 0;border-radius:22px;align-items:start}
  .cf .fld.msg > label{width:auto}
  .cf textarea.inp,.app .cf textarea.inp:focus{height:clamp(60px,9.4svh,92px);padding:4px 0 10px;border-radius:0;font-size:16px}
  .cf .btn-create{margin-top:12px;height:54px}
  .cf-fine{display:flex;margin-top:10px;font-size:13px}
  .ct-reach{display:flex}

  .ct-q .why-grid{grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "faq" "cta";gap:0}
  .ct-q .faq{gap:8px;margin-top:18px}
  .q-cta{margin-top:16px}
  .q-cta .btn-create{width:100%;height:54px}
  .q-cta .note,.ct-q .sec-sub,.ct-q .foot-brand p,.ct-q .q5{display:none}
  /* while an answer is open on a phone, the footer links step aside so the screen still holds it */
  .ct-q:has(details[open]) .foot-in{display:none}
  .ct-q:has(details[open]) .foot-base{border-top:0}
}
@media (max-height:780px){
  @container app (max-width:860px){
    .ct-copy .lede{display:none}
  }
}
@media (max-height:700px){
  @container app (max-width:860px){
    .cf-head{display:none}
    .cf-grid{margin-top:0}
    .cf .fld{height:48px}
    .cf .btn-create{height:50px;margin-top:10px}
    .cf-fine{display:none}
    .ct-q .sec-sub{display:none}
    .ct-q .faq{margin-top:14px;gap:7px}
    .ct-q .faq summary{min-height:50px}
    .q-cta{margin-top:12px}
    .ct-q .foot-in > div:not(.foot-brand){display:none}
    .ct-q:has(details[open]) .foot{display:none}
  }
}
</style>

<meta name="robots" content="noindex,nofollow">
<style>
/* =========================================================================================
   MOCKUPS: one bespoke build across four areas of a business, the free consultation and its booking calendar
   ========================================================================================= */
.mk-flag{position:fixed;left:50%;bottom:14px;z-index:60;transform:translateX(-50%);display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 14px;border-radius:999px;background:rgba(23,17,15,.88);color:#FFFFFF;font-size:12.5px;font-weight:600;letter-spacing:.02em;pointer-events:none;backdrop-filter:blur(6px)}
.mk-flag i{width:7px;height:7px;border-radius:50%;background:#FFB35C}

/* a two-column screen: copy on the left, the one object on the right */
.mk-split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,560px);gap:clamp(28px,5cqi,72px);align-items:center;width:100%}
.mk-split .sec-h{max-width:13ch}
.mk-split.wide{grid-template-columns:minmax(0,.9fr) minmax(0,640px)}
.s-book .hero-main{text-align:left;align-items:center}
.mk-c-copy{display:flex;flex-direction:column;align-items:flex-start;text-align:left}
.mk-c-copy .ticks li{text-align:left}

/* ---------- the four areas around the business (hero) ---------- */
.mk-areas .orb-core small{color:var(--red);font-weight:600}

/* ---------- where does your week go: four columns of tick chips ---------- */
.wk{width:100%;max-width:1120px;margin-top:clamp(18px,3.2svh,36px)}
.wk-tabs{display:none}
.wk-cols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;text-align:left}
.wk-col{display:flex;flex-direction:column;gap:9px;padding:16px 14px 16px;border-radius:24px;background:rgba(255,255,255,.86);border:1px solid var(--line);box-shadow:0 2px 6px rgba(20,12,8,.03),0 30px 60px -48px rgba(120,30,10,.45)}
.wk-h{display:flex;align-items:center;gap:10px;padding:0 2px 6px}
.wk-ic{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--chip);color:var(--red)}
.wk-h b{display:block;font-size:17px;line-height:1.2}
.wk-h small{display:block;font-size:13px;line-height:1.3;color:var(--mut)}
.wk-col .ch{width:100%;justify-content:flex-start;height:44px;padding:0 14px 0 8px;font-size:14.5px;white-space:normal;line-height:1.15;text-align:left}
.wk-col .ch .ch-t{flex:1 1 auto}
.wk-col .ch .ch-h{flex:none;font-size:12.5px;font-weight:600;color:var(--mut)}
.wk-col .ch[aria-checked="true"] .ch-h{color:rgba(255,255,255,.85)}
.wk-sum{display:flex;align-items:center;justify-content:space-between;gap:14px 24px;flex-wrap:wrap;margin-top:16px;padding:12px 12px 12px 24px;border-radius:999px;background:#FFFFFF;border:1px solid var(--line);box-shadow:0 20px 50px -36px rgba(120,30,10,.5);text-align:left}
.wk-tot{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.wk-tot b{font-size:30px;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.wk-tot span{font-size:15.5px;color:var(--ink2)}
.wk-tot em{font-style:normal;font-size:13px;color:var(--mut)}
.wk-sum .btn-create{height:52px;font-size:16.5px;padding:0 24px}

/* ---------- the bespoke build: the one glowing card on the page ---------- */
.bb.card{max-width:1080px;margin-top:clamp(18px,3.4svh,36px)}
.bb .card-in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);gap:clamp(20px,3cqi,44px);padding:clamp(20px,3.2svh,34px) clamp(20px,3cqi,40px)}
.bb-k{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--red)}
.bb-k i{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px var(--chip)}
.bb-h{margin:12px 0 0;font-size:clamp(26px,min(2.6cqi,4.2svh),38px);line-height:1.08;letter-spacing:-.03em;font-weight:600;text-wrap:balance}
.bb-h em{font-family:var(--disp);font-weight:400;color:var(--red);letter-spacing:-.01em}
.bb-pts{list-style:none;margin:clamp(14px,2.4svh,22px) 0 0;padding:0;display:grid;gap:clamp(10px,1.8svh,14px)}
.bb-pts li{display:flex;gap:12px;align-items:flex-start}
.bb-pts li > i{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:10px;background:var(--okbg);color:var(--ok)}
.bb-pts b{display:block;font-size:16.5px;line-height:1.3}
.bb-pts span{display:block;font-size:14.5px;line-height:1.45;color:var(--ink2)}
/* one customer moving through the whole system */
.jr{position:relative;padding:16px 16px 14px;border-radius:22px;background:var(--soft);border:1px solid var(--line)}
.jr-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.jr-top b{font-size:14px}
.jr ol{position:relative;list-style:none;margin:0;padding:0;display:grid;gap:6px}
.jr ol::before{content:"";position:absolute;left:17px;top:18px;bottom:18px;width:2px;background:linear-gradient(var(--line2),var(--line2)) no-repeat;border-radius:2px}
.jr li{position:relative;display:grid;grid-template-columns:36px minmax(0,1fr) auto;align-items:center;gap:10px;padding:6px 10px 6px 0;border-radius:14px}
.jr li > i{position:relative;z-index:1;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:#FFFFFF;border:1.5px solid var(--line2);color:var(--ink2);transition:background .4s,border-color .4s,color .4s,box-shadow .4s}
.jr li b{display:block;font-size:14.5px;line-height:1.25}
.jr li small{display:block;font-size:12.5px;color:var(--mut)}
.jr li .ar{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);white-space:nowrap}
.jr li.lit > i{background:var(--go);border-color:var(--go);color:#FFFFFF;box-shadow:0 0 0 5px rgba(30,123,69,.12)}
.jr li.lit{background:#FFFFFF}

/* ---------- the example plan (what the free call gives you) ---------- */
.plan{width:100%;max-width:520px;padding:clamp(16px,2.6svh,24px);text-align:left}
.pl-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pl-biz{display:flex;align-items:center;gap:12px;margin-top:clamp(10px,2svh,16px)}
.pl-biz .bm{flex:none;display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:var(--soft);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--ink2)}
.pl-biz b{display:block;font-size:16.5px}
.pl-biz span{display:block;font-size:13.5px;color:var(--mut)}
.pl-big{display:flex;align-items:baseline;gap:12px;margin-top:clamp(10px,2svh,16px);padding-top:clamp(10px,2svh,14px);border-top:1px solid var(--line)}
.pl-big b{font-size:clamp(40px,6svh,54px);line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.pl-big b small{font-size:.5em;letter-spacing:0;margin-left:2px}
.pl-big span{font-size:14.5px;line-height:1.35;color:var(--ink2);max-width:18ch}
.pl-k{margin:clamp(10px,2svh,16px) 0 6px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.pl-l{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.pl-l li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:var(--soft)}
.pl-l .n{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#FFFFFF;border:1px solid var(--line);font-size:12.5px;font-weight:700}
.pl-l b{display:block;font-size:14.5px;line-height:1.25}
.pl-l small{display:block;font-size:12px;color:var(--mut)}
.pl-l .h{font-size:13.5px;font-weight:700;color:var(--ok);white-space:nowrap}
.pl-q{display:flex;align-items:center;gap:10px;margin-top:clamp(10px,2svh,14px);padding:10px 12px;border-radius:14px;background:var(--okbg);color:var(--ok);font-size:14px;font-weight:600}
.call-steps{list-style:none;margin:clamp(18px,3svh,28px) 0 0;padding:0;display:grid;gap:clamp(12px,2svh,18px)}
.call-steps li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:14px;align-items:start}
.call-steps .n{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--ink);color:#FFFFFF;font-weight:700}
.call-steps b{display:block;font-size:18px;line-height:1.3}
.call-steps span{display:block;margin-top:2px;font-size:15.5px;line-height:1.5;color:var(--ink2)}

/* ---------- the booking calendar ---------- */
.cal.card{max-width:640px;margin-top:0}
.cal .card-in{padding:clamp(14px,2.2svh,22px) clamp(14px,2cqi,22px) clamp(14px,2.2svh,20px)}
.cal-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.cal-top b{font-size:17px}
.cal-top small{display:block;font-size:13px;color:var(--mut)}
.cal-nav{display:inline-flex;align-items:center;gap:6px}
.cal-nav button{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;border:1px solid var(--line2);background:#FFFFFF;color:var(--ink);cursor:pointer}
.cal-nav button:disabled{opacity:.35;cursor:default}
.cal-nav span{min-width:9.5em;text-align:center;font-size:14px;font-weight:600;color:var(--ink2)}
/* desktop: the whole week on one timeline, so the gaps between free times show */
.cal-grid{position:relative;display:grid;grid-template-columns:44px repeat(5,minmax(0,1fr));gap:0 8px;margin-top:12px}
.cal-dh{padding:6px 0 8px;text-align:center;border-bottom:1px solid var(--line)}
.cal-dh b{display:block;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.cal-dh span{display:block;font-size:19px;font-weight:650;line-height:1.2}
.cal-dh small{display:block;font-size:11.5px;color:var(--mut)}
.cal-times{position:relative;height:var(--ch,330px)}
.cal-times span{position:absolute;right:4px;transform:translateY(-50%);font-size:11.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.cal-col{position:relative;height:var(--ch,330px);background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--ch,330px) / 4 - 1px),var(--line) calc(var(--ch,330px) / 4 - 1px),var(--line) calc(var(--ch,330px) / 4))}
.slot{position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:center;height:34px;border-radius:12px;border:1.5px solid #CFE6D6;background:#F1F8F3;color:#17543A;font:600 14px var(--ui);font-variant-numeric:tabular-nums;cursor:pointer;transition:background .2s,border-color .2s,color .2s,transform .2s,box-shadow .2s}
.slot:hover{border-color:var(--go);transform:translateY(-1px);box-shadow:0 10px 18px -12px rgba(20,110,60,.55)}
.slot[aria-pressed="true"]{background:var(--go);border-color:var(--go);color:#FFFFFF}
.slot:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.cal-days{display:none}
.cal-list{display:none}
.cal-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--mut)}
.cal-foot .lg{display:inline-flex;align-items:center;gap:7px}
.cal-foot .lg i{width:14px;height:14px;border-radius:5px;border:1.5px solid #CFE6D6;background:#F1F8F3}
/* step 2: your details */
.cal-form{display:grid;gap:10px;margin-top:4px}
.cal-when{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:16px;background:var(--okbg);color:var(--ok)}
.cal-when b{display:block;font-size:16.5px;color:#14472F}
.cal-when small{display:block;font-size:13px}
.cal-when button{border:0;background:none;color:var(--ok);font:600 14px var(--ui);text-decoration:underline;cursor:pointer}
.cal-f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cal-form label{display:grid;gap:5px;font-size:13.5px;font-weight:600;color:var(--ink2)}
.cal-form input{height:46px;padding:0 14px;border-radius:14px;border:1.5px solid var(--line2);background:#FFFFFF;font:500 16px var(--ui);color:var(--ink)}
.cal-form input:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 4px var(--ring)}
.cal-help{font-size:13.5px;font-weight:600;color:var(--ink2)}
.cal-help .crow{justify-content:flex-start;margin-top:6px}
.cal-help .ch{height:38px;font-size:13.5px;padding:0 12px 0 6px}
.cal-help .ch .ch-ic{width:24px;height:24px}
.cal-form .btn-create{width:100%;height:54px;font-size:17px;margin-top:4px}
.cal-fine{margin:0;font-size:12.5px;color:var(--mut);text-align:center}
/* step 3: booked */
.cal-done{display:grid;justify-items:center;gap:8px;padding:clamp(18px,4svh,40px) 8px;text-align:center}
.cal-done > i{display:grid;place-items:center;width:58px;height:58px;border-radius:50%;background:var(--go);color:#FFFFFF;box-shadow:0 0 0 8px rgba(30,123,69,.12)}
.cal-done b{font-size:22px;margin-top:8px}
.cal-done p{margin:0;max-width:30ch;color:var(--ink2)}
.cal [data-step]{display:none}
.cal[data-at="pick"] [data-step="pick"],.cal[data-at="done"] [data-step="done"]{display:block}
.cal[data-at="form"] [data-step="form"]{display:grid}

/* the home page teaser: the next free calls */
.nx{width:100%;max-width:500px;padding:clamp(16px,2.6svh,24px);text-align:left}
.nx-l{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.nx-l li{display:grid;grid-template-columns:96px minmax(0,1fr);align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:var(--soft)}
.nx-l li > b{font-size:14.5px;line-height:1.2}
.nx-l li > b small{display:block;font-size:12px;font-weight:500;color:var(--mut)}
.nx-s{display:flex;flex-wrap:wrap;gap:6px}
.nx-s a{display:inline-flex;align-items:center;height:32px;padding:0 12px;border-radius:10px;border:1.5px solid #CFE6D6;background:#F1F8F3;color:#17543A;font-size:13.5px;font-weight:600;text-decoration:none;font-variant-numeric:tabular-nums}
.nx-s a:hover{border-color:var(--go)}
.nx-more{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-size:14px;font-weight:600;color:var(--red);text-decoration:none}

@media (max-height:820px){
  .wk-col{padding:12px 12px;gap:7px}.wk-col .ch{height:40px}.wk-h{padding-bottom:2px}.wk-ic{width:34px;height:34px}
  .wk-sum{margin-top:12px;padding:8px 8px 8px 20px}.wk-tot b{font-size:26px}
  .s-wk .sec-sub,.s-bb .sec-sub{display:none}
  .jr li{padding:4px 10px 4px 0}.jr li > i{width:32px;height:32px}.jr ol::before{left:15px}
  .cal-times,.cal-col{--ch:270px}
}
@media (max-height:700px){.bb-pts li:nth-child(4){display:none}.pl-l li:nth-child(3){display:none}}

@container app (max-width:860px){
  .mk-split,.mk-split.wide{grid-template-columns:minmax(0,1fr);gap:16px}
  .mk-split .sec-h{max-width:none}
  .mk-c-copy{align-items:center;text-align:center}
  /* week: one area at a time behind four tabs */
  .wk{margin-top:14px}
  .wk-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:4px;border-radius:16px;background:var(--soft);border:1px solid var(--line)}
  .wk-tabs button{height:40px;border:0;border-radius:12px;background:transparent;font:600 13px var(--ui);color:var(--ink2);cursor:pointer;line-height:1.1}
  .wk-tabs button[aria-selected="true"]{background:#FFFFFF;color:var(--ink);box-shadow:0 4px 10px -6px rgba(20,12,8,.3)}
  .wk-tabs button .c{display:inline-grid;place-items:center;min-width:16px;height:16px;margin-left:3px;padding:0 4px;border-radius:999px;background:var(--go);color:#FFFFFF;font-size:10.5px}
  .wk-tabs button .c:empty{display:none}
  .wk-cols{display:block;margin-top:10px}
  .wk-col{display:none;padding:12px}
  .wk-col.on{display:flex}
  .wk-sum{border-radius:22px;padding:12px 14px;flex-direction:column;align-items:stretch;gap:10px}
  .wk-tot b{font-size:26px}
  .wk-sum .btn-create{width:100%}
  /* build */
  .bb .card-in{grid-template-columns:minmax(0,1fr);gap:14px;padding:16px 14px}
  .bb-pts{grid-template-columns:1fr 1fr;gap:10px}
  .bb-pts li{flex-direction:column;gap:6px}
  .bb-pts li > span > span{display:none}
  .bb-pts b{font-size:14.5px}
  .jr{padding:12px}
  .jr li{grid-template-columns:32px minmax(0,1fr) auto;padding:3px 8px 3px 0}
  .jr li > i{width:32px;height:32px}.jr ol::before{left:15px}
  .jr li small{display:none}
  /* plan and steps */
  .call-steps{display:none}
  .plan,.nx{max-width:none}
  .s-call .sec-sub,.s-bb .sec-sub,.bb-k{display:none}
  .bb-h{margin-top:0;font-size:24px}
  .bb-pts{margin-top:10px}
  .jr-top{margin-bottom:4px}
  .pl-l small,.pl-big span br{display:none}
  .pl-l li{padding:7px 10px}
  .pl-big b{font-size:42px}
  .cal-list{min-height:40px}
  /* calendar: pick a day, then a time */
  .cal-grid{display:none}
  .cal-days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:12px}
  .cal-days button{display:grid;justify-items:center;gap:1px;padding:8px 0;border-radius:14px;border:1.5px solid var(--line);background:#FFFFFF;font:600 12px var(--ui);color:var(--mut);cursor:pointer}
  .cal-days button b{font-size:18px;color:var(--ink)}
  .cal-days button small{font-size:10.5px;color:var(--go)}
  .cal-days button[aria-selected="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
  .cal-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px;min-height:84px;align-content:start}
  .cal-list .slot{position:static;height:40px}
  .cal-f2{grid-template-columns:1fr}
  .s-book:has(.cal[data-at="form"]) .mk-c-copy,.s-book:has(.cal[data-at="done"]) .mk-c-copy{display:none}
  .cal-form .cal-fine{display:none}
  .cal-form input{height:44px}
  .nx-l li{grid-template-columns:76px minmax(0,1fr)}
}
@container app (max-width:860px){@media (max-height:760px){
  .s-call .sec-sub,.pl-biz,.cal-foot,.s-call .cta-row{display:none}
  .pl-q{display:none}
  .mk-c-copy .lede{font-size:15.5px}
  .nx-l li:nth-child(3),.nx-s a:nth-child(3){display:none}
  .jr li:nth-child(4){display:none}
  .cal-form{gap:6px}.cal-f2{gap:6px}.cal-form input{height:38px;border-radius:12px}.cal-form label{gap:3px;font-size:12.5px}
  .cal-when{padding:8px 12px}.cal-when b{font-size:15px}.cal-help .crow{gap:5px;margin-top:4px}.cal-help .ch{height:32px;font-size:12.5px}
  .cal-form .btn-create{height:46px;font-size:16px}
  .s-bb .sec-h{font-size:28px}
  .wk-col .ch{height:38px}.mk-c-copy .ticks{display:none}.jr li:nth-child(5){display:none}}}
@media (max-width:860px){.mk-flag{left:10px;bottom:10px;transform:none;height:24px;padding:0 10px;font-size:11px}}
@media (prefers-reduced-motion:reduce){.jr li > i{transition:none}}
</style>
